function brokenLab(){let index=0,solved=new Set();$('surface').innerHTML=card('Troubleshooting scenarios',select('challenge-filter','Topic',['All',...new Set(CHALLENGES.map(x=>x[0]))])+out('challenge-list'))+card('Find the cause',out('challenge')+out());const load=i=>{index=i;const c=CHALLENGES[i];$('challenge').innerHTML=`<h3>${esc(c[1])}</h3><p>${esc(c[2])}</p><pre>${esc(c[3])}</pre><p>Which change or explanation addresses the root cause?</p>`+c.slice(5).map((x,k)=>`<button class="answer-option" data-fix="${k}">${esc(x)}</button>`).join('');$('output').innerHTML='';$('challenge').querySelectorAll('button').forEach(b=>b.onclick=()=>{const yes=Number(b.dataset.fix)===0;if(yes)solved.add(i);$('output').innerHTML=hint((yes?'Correct. ':'Try again. ')+esc(c[4]));draw();});};const draw=()=>{$('challenge-list').innerHTML=hint(`Solved ${solved.size} / ${CHALLENGES.length}`)+`<div class="chips">${CHALLENGES.map((c,i)=>[$('challenge-filter').value==='All'||c[0]===$('challenge-filter').value?`<button data-challenge="${i}" class="${index===i?'active':''}">${solved.has(i)?'✓ ':''}${esc(c[1])}</button>`:'']).join('')}</div>`;$('challenge-list').querySelectorAll('button').forEach(b=>b.onclick=()=>{load(Number(b.dataset.challenge));draw();});};$('challenge-filter').onchange=draw;load(0);draw();}
function designLab(){const questions=[['Number of sites',['Single campus','2–5 sites','6–20 sites','20+ sites']],['Users per site',['Under 50','50–250','250–1000','Over 1000']],['Availability target',['Single path acceptable','Redundant gateway and uplinks','Dual providers and resilient core']],['Primary workload',['General office','Voice and video','Data center / applications','Mixed enterprise']],['Operations preference',['Simple static routing','Dynamic routing','Automation and centrally managed policy']]];let step=0,answers=[];$('surface').innerHTML=card('Network design interview',out());const draw=()=>{if(step<questions.length){const q=questions[step];$('output').innerHTML=`<div class="eyebrow">Step ${step+1} of ${questions.length}</div><h3>${q[0]}</h3>${q[1].map((x,i)=>`<button class="answer-option" data-design="${i}">${x}</button>`).join('')}${step?btn('design-back','Back'):''}`;$('output').querySelectorAll('[data-design]').forEach(b=>b.onclick=()=>{answers[step]=Number(b.dataset.design);step++;draw();});if(step)action('design-back',()=>{step--;draw();});}else{const redundant=answers[2]>0,large=answers[0]>1||answers[1]>1;const text=`PARAM CHAWLA — NETWORK DESIGN NOTES\n\n${questions.map((q,i)=>q[0]+': '+q[1][answers[i]]).join('\n')}\n\nArchitecture: ${large?'Hierarchical access / distribution / core':'Access with a collapsed distribution/core'}\nRouting: ${answers[4]===0&&!large?'Static routes for a simple stable topology':'OSPF or another suitable IGP inside the enterprise; use BGP for provider/policy boundaries'}\nAvailability: ${redundant?'Redundant gateways, uplinks and independent failure domains':'Single-path design, with its availability limitations documented'}\nSegmentation: Separate user, server, management and guest VLANs.\nAddressing: Use VLSM and leave growth space.\nSecurity: Least-privilege ACLs, protected management, logging and change control.\nValidation: Test normal and failure paths, return routing, DNS/DHCP and application performance.`;$('output').innerHTML=`<pre>${esc(text)}</pre>`+hint('This is a starting architecture checklist. Real design requires traffic measurements, physical constraints, failure analysis and vendor sizing.')+`<div class="actions">${btn('design-save','Download notes',true)}${btn('design-restart','Start again')}</div>`;action('design-save',()=>download('param-network-design.txt',text));action('design-restart',()=>{step=0;answers=[];draw();});}};draw();}
function cheatLab(){$('surface').innerHTML=card('IPv4 prefix table',table(['Prefix','Mask','Addresses','Usable hosts','Wildcard'],Array.from({length:33},(_,i)=>{const n=Net.subnet('0.0.0.0',32-i);return['/'+n.p,n.mask,n.size.toLocaleString(),n.hosts.toLocaleString(),n.wildcard];})))+card('Protocol reference',table(['Protocol','Transport / identifier','Quick inspection'],[['OSPF','IP protocol 89','show ip ospf neighbor'],['BGP','TCP 179','show bgp summary'],['EIGRP','IP protocol 88','show ip eigrp neighbors'],['IS-IS','Layer 2','show isis neighbors'],['DHCPv4','UDP 67 / 68','show ip dhcp binding'],['DNS','UDP/TCP 53','dig / nslookup'],['ARP','EtherType 0x0806','show ip arp']]));}
function moreLab(){$('surface').innerHTML=card('Wildcard and host requirement',`<div class="fields">${input('more-prefix','Prefix',24,'number','min="0" max="32"')}${input('more-hosts','Required hosts',50,'number','min="1"')}</div>${btn('more-run','Calculate',true)}${out()}`)+card('List host addresses',input('host-block','Small subnet','192.168.10.0/28')+`<div class="actions">${btn('host-list','List addresses')}</div>${out('host-output')}`);action('more-run',()=>{const n=Net.subnet('0.0.0.0',$('more-prefix').value),required=Number($('more-hosts').value);if(!Number.isInteger(required)||required<1||required>2**32-2)throw Error('Use a positive IPv4 host requirement.');const size=2**Math.ceil(Math.log2(required+2)),p=32-Math.log2(size);$('output').innerHTML=stats([['Mask',n.mask],['Wildcard',n.wildcard],['Recommended conventional prefix','/'+p],['Capacity',size-2]])+hint('The size finder reserves network and broadcast addresses. A point-to-point design may use a /31 separately.');});action('host-list',()=>{const n=Net.subnet($('host-block').value);if(n.size>1024)throw Error('Choose a /22 or longer to keep the address list manageable.');$('host-output').innerHTML=table(['Address','Role'],Array.from({length:n.size},(_,i)=>[Net.str(n.start+i),n.p<31&&i===0?'Network':n.p<31&&i===n.size-1?'Broadcast':'Usable']));});$('more-run').click();}
const LESSONS={
 'OSI & TCP/IP':['Use layers to localize a fault: link, addressing, routing, transport, then the application. Encapsulation adds headers as data moves down a stack; the receiver removes and interprets them. The OSI model is a vocabulary, not a requirement that every implementation have seven separate components.','Follow a browser request through Ethernet, IP and TCP. Identify which address changes at a router and which usually remains end to end.','decoder','ip route get 192.0.2.10'],
 'Ethernet & ARP':['A switch learns source MAC addresses on ingress ports. Known unicast frames use the MAC table; broadcasts remain in the VLAN. ARP maps an IPv4 next-hop address to a local-link MAC. A host going off-subnet resolves its gateway MAC.','Walk a request/reply and explain why ARP does not cross a router as an ordinary broadcast.','arp','show mac address-table\nshow ip arp'],
 'Switching & STP':['Redundant Layer 2 links can create loops because Ethernet frames have no router-style TTL. STP elects a root and blocks redundant forwarding paths. RSTP adds alternate roles and rapid transitions when its conditions are satisfied.','Change bridge priorities and costs; identify the root and blocked/alternate ports.','stp','show spanning-tree'],
 'VLANs & Trunks':['VLANs define separate Layer 2 broadcast domains. Access ports normally carry one untagged VLAN; trunks carry multiple VLANs using tags. Native VLAN behavior must agree at both ends. Inter-VLAN traffic requires routing.','Inspect the VLAN ID, PCP and tag overhead, then explain where a native mismatch changes frame classification.','vlan','show interfaces trunk\nshow vlan brief'],
 'IPv4 Addressing':['IPv4 contains 32 bits. A prefix defines the network boundary, independent of historical address classes. RFC 1918 private ranges need appropriate routing or translation for internet connectivity. Special-purpose addresses have uses beyond ordinary unicast.','Classify private, loopback, link-local and documentation addresses.','classes','show ip interface brief'],
 'Subnetting & VLSM':['A prefix fixes the high-order bits; remaining bits select an address in the block. Networks must be aligned to their block size. VLSM allocates different sized blocks, generally placing the largest first. A /31 and /32 have special host-count semantics.','Allocate user, server and management segments; verify no overlap and retain growth space.','vlsm','show ip route connected'],
 'IPv6 & NDP':['IPv6 has eight 16-bit groups. Compression removes leading zeros and replaces one longest run of zero groups. Neighbor Discovery uses ICMPv6 for address resolution and router discovery. SLAAC generally uses a /64 interface prefix, with modern privacy or stable address generation.','Expand and compress an address; divide a /48 into /64s and inspect a modified EUI-64 example.','ipv6','show ipv6 interface\nshow ipv6 neighbors'],
 'Static Routing':['Forwarding uses the longest matching prefix. For the same destination prefix, route preference and metrics determine installed routes. A default route is a fallback; a summary may cover destinations that have no specific route. Return routing is required.','Paste a routing table and test which entry forwards a destination address.','routes','show ip route\nshow ip route 203.0.113.10'],
 'OSPF Fundamentals':['OSPF discovers neighbors using Hellos, exchanges database information, then calculates shortest paths. Adjacency depends on compatible area, timers, authentication and other parameters. Broadcast networks use a DR/BDR to reduce adjacency and flooding overhead.','Walk Down → Init → 2-Way → ExStart → Exchange → Loading → Full.','ospf-neighbor','show ip ospf neighbor\nshow ip ospf interface'],
 'DHCP & DNS':['DHCP leases an address and supplies options such as gateway and DNS servers. A relay bridges the broadcast boundary between clients and a remote server. DNS resolves names using records and caches; transport reachability alone does not prove correct resolution.','Walk DORA, then a recursive DNS lookup and explain the function of the lease and TTL.','dhcp','show ip dhcp binding\nnslookup lab.example'],
 'TCP & UDP':['TCP offers a reliable ordered byte stream with sequence and acknowledgment numbers. SYN and FIN consume sequence space. UDP carries independent datagrams without TCP’s connection and retransmission machinery. Application requirements determine the appropriate behavior.','Step through a handshake, data exchange, retransmission and graceful close.','tcp','ss -tan\nshow tcp brief'],
 'ACLs':['ACLs evaluate conditions in order and stop at the first match. Standard IPv4 ACLs match source addressing; extended ACLs can match source, destination, protocol and ports. Wildcard masks describe which bits to ignore. Rule placement and direction determine the effect.','Create a specific HTTPS permit followed by a deny, and test permitted and denied packets.','acl','show access-lists\nshow ip interface'],
 'NAT & PAT':['Static NAT supplies a persistent address mapping; dynamic NAT allocates from a pool. PAT distinguishes sessions using ports as well as addresses. Translation does not replace filtering or correct return routing. Application payloads and asymmetric routing can complicate behavior.','Compare an inside-local socket with its inside-global representation.','nat','show ip nat translations\nshow ip nat statistics'],
 'Wireless Basics':['Wireless access shares airtime and introduces RF constraints that wired switching does not have. Channel width, interference, signal quality and client capabilities affect throughput. Association and authentication precede useful IP traffic. Separate RF faults from DHCP, DNS and policy faults.','Use the latency simulator to compare LAN and variable-delay profiles; explain why this does not measure real RF conditions.','ping','Inspect controller client state, RSSI, SNR and channel utilization.'],
 'Network Security':['Protect management access, segment users and services, enforce least privilege and collect evidence through logs. Stateful inspection and authentication complement ACLs. Use encrypted management protocols and deliberate trust boundaries. A simulated allow result is not a complete security assessment.','Test ACL ordering, then trace certificate verification in the TLS lab.','tls','show access-lists\nshow logging'],
 'Automation Basics':['Treat configurations as structured, reviewable changes. Read state before writing, validate inputs and check the resulting operational state. NETCONF/RESTCONF and vendor APIs can supply structured data; text parsing has format and platform limits. Keep credentials separate from source.','Export an ACL and interface plan, then identify what must be customized and verified on the target platform.','acl','Compare intended configuration with running and operational state.'],
 'Advanced OSPF':['Type 1/2 LSAs describe area topology. ABRs originate inter-area summaries; ASBRs originate external information. Stub variants control which external and summary information enters an area. A local RIB filter is different from stopping LSDB flooding.','Compare area types, inspect LSA scope and run SPF after a link failure.','area','show ip ospf database\nshow ip ospf border-routers'],
 'BGP Policy':['BGP selects usable routes using path attributes and operator policy. Local preference normally selects an exit inside an AS; MED can express a preferred entry when comparable. Communities mark routes for policy. Import and export policies must be reviewed separately.','Change path attributes, then apply prefix-list and community controls.','bgp-best','show bgp ipv4 unicast\nshow route-map'],
 'BGP Troubleshooting':['First establish transport and session health. Verify peer ASN, source address, TTL/security and negotiated capabilities. Next check route origination, import policy and NEXT_HOP reachability. A route in Adj-RIB-In may not be eligible for selection or installation.','Diagnose Active state, an exact-prefix origination mismatch and an unreachable next hop.','broken','show bgp summary\nshow bgp neighbors'],
 MPLS:['MPLS forwarding looks up a label and can push, swap or pop label stacks. Transport labels deliver traffic to an egress; service labels can select a VPN forwarding context. PHP can remove the transport label before the egress. Control-plane label distribution and the underlying IGP must be healthy.','Walk a basic LSP and then a VPN stack; identify which label changes at each hop.','mpls','show mpls forwarding-table\nshow mpls ldp neighbor'],
 QoS:['QoS manages contention; it does not create bandwidth. Classify and mark traffic, queue it according to policy, and distinguish shaping from policing. Serialization delay depends on packet size and rate. Applications can be harmed by jitter or loss even when average latency appears acceptable.','Calculate serialization delay and bandwidth-delay product, then compare congested latency.','units','show policy-map interface'],
 'IPsec VPN':['IPsec authenticates and protects selected traffic with security associations. IKE negotiates identity and cryptographic policy; ESP carries protected payload. Encapsulation reduces usable inner MTU, and NAT traversal adds UDP overhead. Parameters and peer identities must agree.','Estimate inner MTU and MSS using an explicit overhead assumption.','tunnel','Inspect IKE/IPsec SAs, selectors, counters and path MTU.'],
 'SD-WAN & SDN':['Separate control intent from forwarding state. Central policy can describe application, segmentation and path choices, while data-plane nodes implement forwarding. Controller connectivity does not guarantee overlay reachability. Underlay transport, tunnel MTU and policy must each be validated.','Design a multi-site lab with separate management, transport and service failure checks.','design','Inspect control connections, tunnel state and effective policy.'],
 'Structured Troubleshooting':['Start with the observed failure and scope, gather state, form a testable hypothesis, change one cause and verify. Check both directions of a path. Preserve evidence and compare working and failing examples. Avoid broad changes that merely hide the symptom.','Solve broken configurations and name the evidence that would support each fix.','broken','Collect interfaces, routes, neighbors, policy counters and logs.'],
 'EIGRP & DUAL':['EIGRP’s feasibility condition tests whether a candidate’s reported distance is strictly less than the current feasible distance. A feasible successor supplies a precomputed loop-free alternate. Without one, DUAL can run a diffusing computation. Classic metrics combine minimum bandwidth and cumulative delay with configured K values.','Vary reported and feasible distances; distinguish failure of the condition from proof of a routing loop.','eigrp','show ip eigrp topology all-links'],
 'BGP Path Selection':['Compare candidates for the same prefix. Higher weight/local preference and shorter AS paths are common early Cisco-style criteria, but route validity comes first. Forwarding between prefixes still uses longest-prefix match. MED comparison, multipath and later tie-breaks depend on platform policy.','Make an unreachable next hop lose despite favorable attributes, then change the decisive attribute.','bgp-select','show bgp ipv4 unicast <prefix>'],
 Multicast:['Multicast delivers to receiver groups rather than all hosts. IGMP/MLD signal local membership; multicast routing builds delivery trees. The reverse-path-forwarding check uses the expected path toward a source or rendezvous point and helps prevent loops. Unicast reachability is necessary but not sufficient.','Describe a missing receiver membership and an RPF failure, and identify the separate tables to inspect.','routes','show ip mroute\nshow ip igmp groups'],
 'Route Redistribution':['Redistribution moves routes between control-plane domains and can introduce loops, changed metrics or information loss. Bound the imported prefixes, set appropriate metrics and tag routes to prevent feedback. Administrative preference and longest-prefix behavior can make an unintended route win.','Use a prefix-list to allow intended ranges and reject feedback routes; explain a discard summary route.','prefix','show ip protocols\nshow ip route'],
 'Segment Routing':['Segment Routing encodes a path or service intent as segments. SR-MPLS uses label stacks; SRv6 uses IPv6 segment identifiers and associated behaviors. Topology and policy still require usable underlay reachability. Stack/encapsulation overhead and protection behavior affect design.','Use the MPLS walker to explain push, swap and pop, then describe how an explicit segment list changes path intent.','mpls','Inspect SID advertisements, SR policy and forwarding entries.'],
 'EVPN & VXLAN':['VXLAN carries a Layer 2 segment across a routed IP fabric using a VNI. EVPN distributes reachability and supports multi-tenancy and multi-homing. VTEP reachability, route targets, VNI mapping and MTU must align. A working BGP session does not prove a tenant is correctly connected.','Compute VXLAN overhead and build a validation checklist for VTEP, VNI and tenant reachability.','tunnel','Inspect EVPN routes, NVE peers, VNI state and underlay routes.'],
 'Network Automation':['Automation should preserve intent, scope and verification. Model inputs, stage a diff, validate syntax and dependencies, then check operational state after the change. Use idempotent operations and rollback plans when appropriate. Secrets belong in protected runtime configuration.','Export a reviewed policy and write the pre-change/post-change checks needed before device deployment.','design','Validate intended state against configuration and operational APIs.'],
 'IS-IS':['IS-IS exchanges Layer 2 protocol messages and maintains link-state databases. Level 1 provides intra-area routing; Level 2 connects areas. IIHs form adjacencies, and CSNP/PSNP exchanges help synchronize LSPs. NET addressing and authentication must be compatible.','Walk the IS-IS protocol scenario and compare it with OSPF’s packet transport and area model.','protocol','show isis neighbors\nshow isis database'],
 'Advanced BGP':['Route reflection reduces iBGP mesh requirements but changes path visibility and adds loop-prevention attributes. Communities and route maps implement import/export policy. RPKI origin validation checks origin authorization and max length, while route leaks also require export relationship controls.','Compare a more-specific hijack with an origin-invalid route rejected by policy.','security','show bgp neighbors\nshow bgp ipv4 unicast'],
 'MPLS Traffic Engineering':['Traffic engineering selects paths according to constraints rather than only the IGP shortest path. RSVP-TE and SR policies have distinct control mechanisms. Bandwidth admission, disjointness, failure protection and actual forwarding must be checked. A configured explicit path is only intent until signaling and forwarding succeed.','Fail a topology link and compare the new shortest path with a desired engineered path.','topology','Inspect tunnel/policy state, reservations and label forwarding.']

function courseLab(id){let selected=COURSES[id][0];$('surface').innerHTML=card(id.toUpperCase()+' study modules',`<div class="course-grid">${COURSES[id].map((m,i)=>`<button class="module" data-topic="${esc(m)}"><span>MODULE ${String(i+1).padStart(2,'0')}</span><strong>${esc(m)}</strong></button>`).join('')}</div>`)+card('Lesson and lab',out());const show=m=>{selected=m;const lesson=LESSONS[m];$('output').innerHTML=`<div class="eyebrow">${id.toUpperCase()} · ${COURSES[id].indexOf(m)+1} / ${COURSES[id].length}</div><h3>${esc(m)}</h3><p>${esc(lesson[0])}</p><h3>Practice task</h3><p>${esc(lesson[1])}</p><div class="actions"><button id="course-open" class="primary">Open related lab</button><button id="course-next">Next module</button></div><h3>Verification</h3><pre>${esc(lesson[3])}</pre><details class="lesson"><summary>Explain it back</summary><p>Describe the control-plane and forwarding behavior. Name one failure mode, the evidence it creates, and the narrowest fix you would verify.</p></details>`;action('course-open',()=>navigate(lesson[2]));action('course-next',()=>show(COURSES[id][(COURSES[id].indexOf(selected)+1)%COURSES[id].length]));};$('surface').querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>show(b.dataset.topic));show(selected);}
function roadmapLab(){const topics=[['bgp-animation','Establish the session','TCP/179, OPEN, KEEPALIVE and UPDATE'],['bgp-best','Select a usable route','Next-hop reachability and attribute order'],['next-hop','Resolve the next hop','Recursive reachability and next-hop-self'],['prefix','Control prefix policy','Exact, ge/le and route-map actions'],['community','Apply community intent','Tagging and explicit receiver policy'],['regex','Read AS-path policy','Boundaries, origins and transit patterns'],['security','Protect announcements','Origin validation and export relationships'],['broken','Troubleshoot with evidence','Session, policy and forwarding problems']];$('surface').innerHTML=card('BGP learning path',topics.map(([id,t,d],i)=>`<div class="step"><span>${i+1}</span><div style="flex:1"><strong>${t}</strong><p>${d}</p></div><button data-roadmap="${id}">Open lab</button></div>`).join(''));$('surface').querySelectorAll('[data-roadmap]').forEach(b=>b.onclick=()=>navigate(b.dataset.roadmap));}
function aboutLab(){$('surface').innerHTML=card('Param Chawla',`<div style="display:flex;align-items:center;gap:18px;margin-bottom:22px"><span class="avatar" style="width:74px;height:74px;font-size:26px">PC</span><div><h3 style="margin:0">Param Chawla</h3><p style="margin:0">Senior Network Engineer · Wi-Fi SME</p></div></div><p>Accomplished Senior Network Engineer and Wi-Fi SME with 18+ years of experience designing, deploying, and optimizing high-performance, mission-critical enterprise networks across diverse industries. Expertise spans advanced wireless architectures, secure LAN/WAN infrastructures, data centers, and cloud integrations, consistently delivering resilient and scalable solutions. Proven pre-sales and solutions consulting experience, including technical scoping, solution design, Bill of Materials creation, and customer workshops that drive new business opportunities. Recognized for blending deep technical expertise with strategic vision, enabling organizations to adopt emerging technologies, enhance operational efficiency, and secure infrastructure while supporting growth.</p><p><a href="https://www.linkedin.com/in/parmendra-chawla-9288a024/" target="_blank" rel="noopener">View my LinkedIn profile ↗</a></p><div class="chips"><button data-about="ipv4">Subnetting</button><button data-about="protocol">Protocol simulations</button><button data-about="topology">Network topology</button><button data-about="quiz">Practice</button></div>`)+card('How to use this lab',`<div class="step"><span>1</span><div><strong>Start with a concept</strong><p>Learn the bits, masks and protocol messages before tuning a design.</p></div></div><div class="step"><span>2</span><div><strong>Change one input</strong><p>Observe which result changes and explain why.</p></div></div><div class="step"><span>3</span><div><strong>Practice a failure</strong><p>Check the evidence, choose a fix and verify both directions of the path.</p></div></div>`)+card('Inspiration and acknowledgments', '<p>This workshop was directly inspired by <a href="https://chaithu-lets-code.github.io/SubnetPro/" target="_blank" rel="noopener">SubnetLab Pro by Chaithanya Kumar Katari</a>. Its topic selection and consolidated lab approach informed this project. Adapted and extended for Param Chawla with its own implementation, design and additional wireless tools.</p>')+card('Lab scope',`<p>Created for Param Chawla as a personal workspace for networking study and hands-on practice.</p><p>Protocol scenes are educational models. They do not send real packets or replace equipment emulation. The public ASN lookup calls RIPE Stat only when requested. Browser-generated key material stays local.</p><p><a href="https://www.rfc-editor.org/rfc/rfc2328" target="_blank" rel="noopener">OSPFv2 reference</a> · <a href="https://www.rfc-editor.org/rfc/rfc4271" target="_blank" rel="noopener">BGP reference</a> · <a href="https://www.rfc-editor.org/rfc/rfc4291" target="_blank" rel="noopener">IPv6 addressing</a></p>`);$('surface').querySelectorAll('[data-about]').forEach(b=>b.onclick=()=>navigate(b.dataset.about));}

</script><script>// Independently written lessons; curriculum coverage informed by SubnetLab Pro.
const COURSE_SOURCE='https://chaithu-lets-code.github.io/SubnetPro/';
COURSES.ccna=['OSI & TCP/IP','Ethernet & ARP','Switching & STP','IP Routing','TCP & UDP','DHCP & DNS','ACLs','OSPF Fundamentals','NAT & PAT','Wireless Basics','HSRP / VRRP / GLBP','Network Security','EtherChannel','EIGRP Fundamentals','IPv6 & NDP','WAN & Distance Vector','VLANs & Trunks','IPv4 Addressing','Subnetting & VLSM','Automation Basics'];
LESSONS['IP Routing']=['The RIB selects usable routes. The FIB and adjacency information support packet forwarding. Compare prefix length before route preferences.','Verify forward and return routes on a three-router path.','routes','show ip route\nshow ip cef\nshow adjacency detail'];
LESSONS['HSRP / VRRP / GLBP']=['First-hop redundancy preserves a virtual gateway while physical routers change roles. Track upstream health as well as the LAN link.','Fail a gateway uplink and verify the alternate path.','arp','show standby brief\nshow vrrp brief\nshow glbp brief'];
LESSONS.EtherChannel=['Compatible links form one logical port-channel. Negotiation controls membership; hashing controls distribution.','Build an LACP bundle and test member failure.','stp','show etherchannel summary\nshow lacp neighbor'];
LESSONS['EIGRP Fundamentals']=['EIGRP advertises distance-vector reachability and uses DUAL for loop-free convergence.','Compare reported distance, feasible distance and total distance.','eigrp','show ip eigrp neighbors\nshow ip eigrp topology all-links'];
LESSONS['WAN & Distance Vector']=['Distance-vector routing exchanges reachability with neighbors. WAN encapsulation and authentication need separate verification.','Trace a withdrawal and diagnose a PPP authentication failure.','protocol','show ip protocols\nshow ip route rip\nshow interfaces serial 0/0/0'];
const COURSE_DEEP={};
courseDeep('ACLs',[
['Packet matching','Rules are evaluated in order; the first match stops processing. Standard ACLs match IPv4 sources; extended rules add destinations, protocol and ports. An unmatched packet meets an implicit deny in ordinary interface ACL use. Inbound/outbound direction is relative to the interface, not to the user. Counters are evidence that traffic reached a rule, not proof of end-to-end application success.'],
['Wildcards and route policy','A wildcard 0 requires equality; 1 ignores that bit. 0.0.0.63 matches an aligned /26 block. Non-contiguous wildcards are possible in some ACL implementations and cannot always be described as one subnet. Prefix lists match route prefixes and optional ge/le lengths; route maps combine ordered match/action/set logic. Their semantics depend on the feature using them: a route-map deny and an interface packet deny are not universally interchangeable.'],
['Editing and placement','Use named entries and sequence numbers for reviewable changes. Test the explicit permit, explicit deny and unmatched case. Check exact prefixes separately from more-specific children. Keep management access and rollback reachable while evaluating policy in an emulator.']
],['Mechanism','Primary purpose'],[['Standard ACL','Source IPv4 packet match'],['Extended ACL','Protocol, address and port match'],['Prefix list','Prefix plus mask-length policy'],['Route map','Feature-specific match/set/action']],'Users 192.0.2.0/24 — R1 — HTTPS server 198.51.100.10',['Permit HTTPS from users to the server.','Deny other user traffic explicitly.','Test allowed TCP 443, denied TCP 22 and a different source.','Move the broad deny first and explain the result; restore order.'],'ip access-list extended USERS\n 10 permit tcp 192.0.2.0 0.0.0.255 host 198.51.100.10 eq 443\n 20 deny ip any any\ninterface GigabitEthernet0/0\n ip access-group USERS in\nshow access-lists USERS','Only the intended traffic matches the permit; counters and direction agree with the test.','A broad deny precedes a specific permit. Result?', ['The later permit wins','First matching deny wins','Both are merged'],1,'Ordered first-match processing makes the later permit unreachable.',['acl','acl-builder','prefix'],'https://www.cisco.com/c/en/us/tech/security-vpn/ip-access-lists/index.html');
courseDeep('OSPF Fundamentals',[
['Neighbor state machine','Down means no recent neighbor information. Init means a Hello was seen without bidirectional recognition. 2-Way means the peer lists our router ID. ExStart negotiates database exchange; Exchange sends descriptions; Loading requests missing LSAs; Full means databases synchronized for the adjacency. Attempt applies to configured neighbors on relevant NBMA implementations. Two DROTHERs on a broadcast LAN can normally remain 2-Way.'],
['Election and packet fields','Router ID identifies the router; it is not necessarily a forwarding address. Broadcast segments elect DR/BDR by priority and router ID among eligible candidates; priority zero is ineligible. Elections are not normally preemptive. Hello compatibility includes area, authentication, timers, relevant mask and options. DR/BDR reduce full-mesh adjacency on multiaccess links.'],
['Route types and failure evidence','O is intra-area, O IA inter-area, E1 adds internal path cost to the external metric, and E2 primarily compares external cost with internal cost as a relevant tie-break. Check neighbor/interface state before routes. ExStart/Exchange problems can involve MTU or negotiation; 2-Way alone is not automatically an error.']
],['State','Question to ask'],[['Init','Does the other side hear us?'],['2-Way','Is a full adjacency required here?'],['ExStart / Exchange','MTU, DBD sequencing, IDs?'],['Full but no route','LSDB, route type and RIB selection?']],'R1/R2/R3 on one broadcast LAN, plus R3 loopback',['Set unique router IDs and one area.','Observe DR, BDR and DROTHER adjacencies.','Set one router priority zero and perform a controlled lab election.','Introduce a timer mismatch, identify it and restore.'],'router ospf 10\n router-id 1.1.1.1\ninterface GigabitEthernet0/0\n ip ospf 10 area 0\nshow ip ospf neighbor\nshow ip ospf interface','Required adjacencies reach Full; DROTHER pairs may remain 2-Way. Routes match advertised reachability.','Two DROTHERs remain 2-Way on Ethernet. Is that necessarily broken?', ['Yes','No, that can be expected','It proves duplicate addressing'],1,'Full adjacencies normally form toward DR/BDR on the broadcast segment.',['ospf-neighbor','ospf-dr','ospf-path'],'https://www.rfc-editor.org/rfc/rfc2328');
courseDeep('NAT & PAT',[
['Translation types and terminology','Static NAT supplies a stable mapping; dynamic NAT allocates from a pool; PAT distinguishes sessions by translated ports as well as addresses. Inside local is the inside host address as represented internally; inside global is its outside representation. Outside local/global describe the outside peer from each address realm. Inspect the complete protocol/socket tuple rather than treating NAT as address replacement alone.'],
['PAT walk and dependencies','Two clients can share one global IPv4 address using distinct translated source ports. Replies must match an active translation and have correct routing. Mark inside/outside interfaces deliberately. A translation entry does not prove the packet passed filtering, reached the server or returned. Asymmetric paths and unsolicited inbound traffic require separate design decisions.'],
['Payload helpers and diagnosis','Some applications carry addresses/ports in payloads. ALGs may rewrite or inspect them, and encrypted payloads or endpoint behavior can complicate helpers. NAT is not a replacement for firewall policy. Compare counters, original/translated tuples and captures on each side before clearing state.']
],['Example','Tuple'],[['Client A','192.0.2.10:50000 → 203.0.113.5:40001'],['Client B','192.0.2.11:50000 → 203.0.113.5:40002'],['Server','198.51.100.10:443'],['Reply lookup','Protocol + translated socket and peer context']],'Two inside clients — NAT router — outside server',['Assign inside/outside roles.','Configure PAT for only the intended inside prefix.','Open two connections and compare translated ports.','Remove the outside default route; show why NAT state alone is insufficient.'],'access-list 10 permit 192.0.2.0 0.0.0.255\nip nat inside source list 10 interface GigabitEthernet0/1 overload\ninterface GigabitEthernet0/0\n ip nat inside\ninterface GigabitEthernet0/1\n ip nat outside\nshow ip nat translations\nshow ip nat statistics','Distinct translated sockets support both sessions when routing and policy permit the return path.','Does a translation entry prove application connectivity?', ['Always','Only with a static mapping','No'],2,'State can exist even when routing, filtering or the application fails.',['nat','capture'],'https://www.rfc-editor.org/rfc/rfc3022');
courseDeep('Wireless Basics',[
['Standards and RF decisions','802.11n/HT, ac/VHT, ax/HE and be/EHT differ in supported widths, modulation and multi-user capabilities. A client negotiates a subset of AP capabilities. PHY rate is not useful throughput. Channel width trades spectrum reuse and noise against nominal rate; EIRP, receive sensitivity, interference and client return-path power matter together. Use measured spectrum and application evidence, not maximum marketing rate, for a design.'],
['Association and key establishment','Discovery, authentication/association and security exchanges precede ordinary IP service. WPA2-Personal derives key material from the configured credentials; enterprise authentication commonly uses 802.1X/EAP and RADIUS. The four-way handshake confirms shared key possession and establishes temporal key context. WPA3-Personal uses SAE; it does not turn every password or deployment into an automatically secure configuration.'],
['Controller and roaming behavior','CAPWAP separates AP/control relationships and can carry data depending on deployment mode. 802.11k provides measurement assistance, 802.11v transition guidance and 802.11r fast-transition mechanisms; the client and deployment must support the behavior. A client can associate successfully yet fail DHCP, DNS or access policy. Capture placement must follow the correct channel and transition.']
],['Evidence','Interpretation'],[['RSSI / SNR','Signal and noise context'],['Retries / airtime','Reliability and shared medium'],['Client capability','Negotiated streams/width/MCS'],['Security / IP state','Separate stages of connectivity']],'Client — AP — controller / RADIUS — gateway',['Compare one/two-stream rates in MCS Explorer.','Calculate a baseline path loss and uplink/downlink budget.','Trace association, enterprise authentication, key exchange and DHCP as distinct checkpoints.','Investigate a roaming gap using synchronized old/new AP evidence.'],'# Evidence checklist\nClient channel, width, MCS, streams\nRSSI, SNR, retries, utilization\nAssociation and EAP result\nFour-way-handshake completion\nDHCP, resolver, policy placement','Performance and access depend on RF, MAC, security and IP evidence together.','AP supports four streams; client supports two. Which limits the link?', ['Four','Two','Six'],1,'The negotiated link is bounded by both endpoints.',['mcs','fspl','wifi-rf','cwnp'],'https://www.cisco.com/c/en/us/support/docs/wireless-mobility/wireless-lan-wlan/212892-802-11ac-wireless-throughput-testing-and.html');
courseDeep('HSRP / VRRP / GLBP',[

['Hashing and STP','A hash maps a flow to a member using selected addresses or ports. One ordinary flow usually remains on one member: two 1 Gb/s links do not guarantee 2 Gb/s for a single transfer. Many flows can distribute unevenly because hash inputs are similar. STP sees the logical bundle; an individual member failure need not change the topology while the bundle stays operational.'],

courseDeep('EIGRP Fundamentals',[
['Neighbor and topology state','Neighbors form with compatible autonomous-system/address-family, authentication and K-value settings. The neighbor table tracks peers; topology information tracks reported paths; the routing table contains installed routes. EIGRP uses reliable delivery for selected messages, with Hello, Update, Query, Reply and acknowledgment behavior. Queries are not ordinary periodic full-table updates.'],
['Metric example','With classic default K values, the scaled metric is 256 × (10^7/minimum bandwidth in kb/s + sum of delays in tens of microseconds), subject to implementation arithmetic. If minimum bandwidth is 100000 kb/s and cumulative delay 200 µs, components are 100 and 20, giving 30720. Configured bandwidth influences the metric; it is not a throughput reservation. Wide metrics use different scaling.'],
['Successor, feasibility and variance','A feasible successor must have reported distance strictly below the feasible-distance bound. Failing that test does not prove a loop; it means local feasibility is not established. Feasible distance is a historical bound since the relevant passive-state transition, not always the current total distance. Variance permits eligible unequal-cost paths within a multiple of the best metric; eligibility still requires feasibility. Summarization and stub routing can reduce query scope.']

courseDeep('WAN & Distance Vector',[
['Distance-vector updates and loops','A router learns a neighbor’s advertised distance and adds its own cost. RIPv2 uses hop count, with 16 as unreachable; it carries masks and commonly multicasts updates to 224.0.0.9. Stale routes can count toward infinity after a failure. Split horizon, poisoned reverse, route poisoning, triggered updates and timers limit propagation problems; no single mechanism is a blanket cure for every topology.'],
['Serial encapsulation and authentication','HDLC and PPP are historical serial link choices; modern WAN designs often use routed Ethernet, VPNs and overlays. PPP LCP negotiates the link, authentication can use PAP/CHAP, and network-control protocols enable network-layer service. PAP transmits credentials without CHAP’s challenge-response protection; CHAP itself is not a modern encryption solution. Peer identity and secret agreement must align.'],
['Operational diagnosis','Separate physical carrier, encapsulation/LCP, authentication, address negotiation and routing. A link can be up while IP reachability fails. Avoid importing historical configuration unchanged into a current production environment. Compare timer-driven withdrawal with explicit failure notification.']

['VTP, native mismatch and routing','VTP can distribute VLAN state and therefore requires deliberate domain/version/trust planning. A native mismatch can classify untagged frames differently. Use an SVI or router subinterface for inter-VLAN forwarding, with correct gateways and policy. Inspect both Layer 2 presence and Layer 3 reachability.']

['LSA scope and area boundaries','Type 1 router and 2 network LSAs describe local-area topology. ABRs advertise Type 3 inter-area prefixes and Type 4 ASBR reachability; Type 5 external LSAs cross ordinary areas. NSSA ASBRs use Type 7, with eligible translation to Type 5 by an ABR. Normal stub areas retain Type 3 inter-area information and an ABR default; they do not carry ordinary Type 5 externals. Totally-stub variants suppress ordinary summaries while retaining the default.'],

['Convergence and RIB differences','BFD accelerates detection, not every later stage. Flooding, SPF scheduling, RIB/FIB programming and application recovery also contribute. A local RIB filter differs from LSDB filtering. With Full adjacency but missing routes, inspect reachability in LSDB, route type preference, forwarding address, summaries and installed competing routes.']

courseDeep('BGP Policy',[
['Session and usable routes','Idle, Connect, Active, OpenSent, OpenConfirm and Established describe session progress. Active commonly means TCP connection attempts, not a healthy session. A usable route requires policy acceptance and NEXT_HOP resolution. Establishing TCP/179 and exchanging OPEN/KEEPALIVE is only the first stage.'],
['Best-path and direction','Common Cisco-style comparisons include weight, local preference, local origination, AS-path length, origin and MED under its comparison rules, then eBGP/iBGP, next-hop IGP cost and tie-breaks. Exact behavior is platform/policy-dependent. Local preference influences exits inside an AS; MED and prepending can influence a neighbor’s choice only under that neighbor’s policy. Longest-prefix forwarding remains separate from same-prefix BGP selection.'],
['Transit policy and scaling','Use explicit import/export bounds, expected neighbor ASN, prefix limits and communities. A route reflector reduces iBGP full mesh but can hide alternate paths; ORIGINATOR_ID and CLUSTER_LIST prevent reflection loops. Communities encode policy labels, not actions until a receiving policy interprets them. Validate both the received route and what is advertised outward.']

courseDeep('QoS',[

['Planes and component roles','Separate management/intent, control distribution and packet forwarding. In Cisco Catalyst SD-WAN, the Manager handles management, Controllers distribute control information and the Validator supports onboarding/orchestration roles; older vManage/vSmart/vBond names appear in legacy material. WAN edges forward traffic across transports. Product details vary by release.'],
['OMP, overlay and application policy','Overlay routes, transport locators and service information need valid control and data relationships. Application-aware routing uses measured path properties and policy; control connectivity alone does not prove tunnel forwarding or SLA satisfaction. Underlay reachability, encryption, MTU, segmentation and policy are separate checks.'],
['SDN and modeled configuration','A controller can express intent while nodes enforce it. YANG defines schema, not transport; NETCONF/RESTCONF are interfaces to modeled data. Validate effective policy and operational results. Compare traditional WAN routing, MPLS transport and SD-WAN overlay without assuming they are mutually exclusive.']

['Reading operational evidence','Interface state, neighbor/adjacency, route installation, forwarding resolution, policy counters and packet captures answer different questions. An error-free interface is not a working route; a route is not resolved adjacency; a ping is not complete application acceptance. Capture absence can reflect poor placement.'],
['Verification and rollback','Define expected results and stop conditions in advance. Avoid broad resets that erase evidence or hide a dependency. Document the cause and proof, including failures you ruled out. Restore the baseline when a test change does not improve the targeted behavior.']

['Metrics, UCMP and query boundaries','Classic default-K metric uses scaled bandwidth and delay; named/wide metrics use different representation. For best total distance100, variance2 permits a feasible path of180 but not210. A path with a low total distance still needs feasibility. Stub advertisements and summarization bound query scope. Stuck-in-active requires investigating query/reply delivery, peer health and topology scope rather than only raising a timer.'],
['Related BGP scale concepts','Confederations organize sub-ASes under an external confederation identity. Add-Path negotiates advertisement of multiple paths per prefix, reducing some hidden-alternate problems. FlowSpec distributes match/action rules; origin/trust, validation and effect on traffic must be bounded. These are separate control-plane mechanisms, not EIGRP extensions.']

courseDeep('BGP Path Selection',[
['Validate then compare','Reject invalid/unusable candidates before preference. Typical Cisco order considers higher weight/local preference, local origination, shorter AS path, lower origin type, comparable MED, eBGP over iBGP, lower next-hop IGP cost, applicable multipath and later stability/router-ID/cluster/peer tie-breaks. Platform knobs can change comparisons. There is no universal vendor-independent thirteen-step list.'],
['Exit, entry and multipath','Weight is local to a router; LOCAL_PREF propagates inside the AS. MED normally compares selected neighboring-AS contexts unless policy changes it. AS prepending and communities affect a neighbor only through accepted policy. Multipath installation requires supported equality criteria and configuration; advertising extra paths through Add-Path is a separate feature.'],

],['Path','Local pref / AS path / validity'],[['A','200 / 65020 65030 / invalid next hop'],['B','100 / 65040 / valid'],['Result','B, before comparing A’s favorable preference']],'AS65010 router with two paths to 198.51.100.0/24',['Make path A preference higher.','Remove A’s next-hop resolution; predict B.','Restore resolution and change one attribute at a time.','Add a /25 and compare forwarding versus same-prefix selection.'],'show bgp ipv4 unicast 198.51.100.0/24\nshow ip route 192.0.2.2\nshow ip cef 198.51.100.10\nshow route-map','The decisive valid-path criterion explains the selected BGP route; prefix length explains forwarding.','Which comparison comes first for this exercise?', ['Route usability','Highest weight even if invalid','Longest AS path'],0,'An unusable next hop excludes a candidate from ordinary selection.',['bgp-select','bgp-best','next-hop'],'https://www.rfc-editor.org/rfc/rfc4271');

['RPF and RP discovery','RPF checks the expected incoming interface toward the source or RP according to the multicast routing information used by the platform. Wrong unicast/RPF reachability can drop multicast even when receiver membership exists. Static RP, BSR, Auto-RP and Anycast-RP are deployment choices with different dependencies. Verify consistent RP mapping and state rather than merely whether PIM neighbors exist.'],
['Control and data verification','Inspect receiver groups, PIM neighbors, (*,G)/(S,G) entries, incoming interface, outgoing-interface list and packet counters. IGMP snooping controls Layer 2 multicast distribution and may depend on a querier; it is not routed PIM. Test receiver join/leave, an RPF mismatch and restoration in an emulator supporting the required features.']

['Feedback prevention','With two redistribution points, a route can return to its origin through another protocol and look preferable. Bound imported prefixes and set origin tags; deny re-entry using a reviewed policy. Tags are meaningful only when preserved and checked by the participating mechanisms. Summarization changes failure granularity and can create blackholes for missing components.'],

['SRv6 and behaviors','SRv6 encodes segment identifiers in IPv6 and uses specified endpoint behaviors; the Segment Routing Header can carry a segment list. Locator routing, endpoint functions, encapsulation MTU and policy must align. SRv6 is not merely replacing a numeric MPLS label with any IPv6 address.'],
['Protection and comparison','TI-LFA precomputes repair paths under topology/algorithm constraints. Detecting failure, activating repair and restoring a converged path are distinct. Traditional LDP, RSVP-TE and SR policies distribute/path-select differently, so compare control dependencies, explicit intent and operational support rather than declaring one universally superior.']

['EVPN reachability and IRB','EVPN Type2 routes carry MAC/IP information, Type3 supports inclusive multicast/BUM membership, and Type5 carries IP prefixes under its extension. Route targets control tenant import/export. Symmetric IRB routes through source and destination VRFs using a Layer3 VNI; asymmetric IRB has different bridging/routing and VNI requirements. A BGP session alone does not validate tenant mapping.'],

['Transport, schema and orchestration','SSH CLI, NETCONF, RESTCONF and gNMI expose different operations and data models. YANG describes schema; it is not an RPC transport. Tools such as Netmiko focus on CLI workflows, NAPALM on common abstractions and Nornir on task orchestration; coverage varies by driver/version. Verify capabilities instead of assuming every platform supports identical semantics.'],
['Templates and transactions','Jinja2-style templates render inputs; rendering alone does not validate addresses or relationships. Validate first, render a diff, review scope and apply with supported transaction/rollback behavior. NETCONF capabilities determine candidate/validate/confirmed-commit support. Ansible idempotence depends on module, inputs and device state; it is not guaranteed by using a playbook.'],
['Failure isolation and related overlays','Keep credentials in protected runtime storage, redact logs and rate-limit rollout. Use read-only observations and operational assertions before/after changes. DMVPN Phase2 and Phase3 differ in spoke path resolution and NHRP redirect/shortcut behavior; automate their configuration only after verifying underlay, tunnel, NHRP, IPsec and routing as separate dependencies.']
],['Artifact','Validation'],[['Inventory','Explicit targets and capabilities'],['Data model','Schema plus relationships'],['Diff','Intent and blast radius'],['Result','Operational assertions and rollback']],'Inventory → validated model → rendered diff → emulator',['Define schema and cross-field validation.','Render a two-device change and inspect differences.','Simulate one failed postcheck and choose rollback/stop behavior.','Export the reviewed change plan without credentials.'],'# Offline plan example\n{\n  "targets": ["lab-r1", "lab-r2"],\n  "precheck": "expected current routes",\n  "postcheck": "neighbor and service success",\n  "rollback": "reviewed baseline"\n}','Generated artifacts are bounded and verifiable; this browser lab does not execute device automation.','Does template rendering alone validate network semantics?', ['Yes','No','Only for small configs'],1,'Schema and relationship checks precede rendering; operational checks follow deployment.',['automation','design'],'https://www.rfc-editor.org/rfc/rfc6241');

['PDUs and TLVs','IS-IS runs directly over its link-layer transport rather than ordinary IP protocol89. IIHs discover/maintain adjacency, LSPs describe topology, CSNPs summarize database state, and PSNPs acknowledge/request information according to link type. TLVs carry extensible information including IP reachability and segment-routing attributes. DIS election on a LAN is distinct from OSPF DR/BDR behavior.'],

['Communities, security and policy','Standard/extended/large communities have distinct encoding and applications. send-community behavior and receiving route maps determine whether a tag produces action. Origin validation checks authorized origin/max-length, not every route leak. Export relationship controls, prefix limits and intentional import filters address other risks. FlowSpec actions require trusted origin and bounded validation.'],
['PIC, graceful restart and protection','PIC can preprogram alternate forwarding to reduce per-prefix work on failure; support/topology matter. Graceful restart retains routes during a control restart based on negotiated behavior and timers; stale paths can harm forwarding if the assumption is wrong. LLGR extends retention under supported policy. CoPP protects device processing but must preserve legitimate routing/control traffic. Detection, alternate activation and final convergence are separate measurements.']

['PATH, RESV and traffic steering','RSVP PATH carries path/session sender intent downstream; RESV allocates reservation/label state upstream. A signaled tunnel can be up but unused if routing, autoroute, forwarding adjacency or explicit steering does not send traffic into it. Check actual forwarding and counters before concluding service succeeds.'],

ence')+'<div class="actions">'+btn('course-save-notes','Save notes locally')+btn('course-download','Download module guide')+'</div>'+out('course-note-status'))+card('References','<p><a href="'+esc(d.reference)+'" target="_blank" rel="noopener">Protocol / vendor reference ↗</a> · <a href="'+COURSE_SOURCE+'#'+id+'" target="_blank" rel="noopener">Original course inspiration ↗</a></p>')+'<div class="actions course-navigation">'+btn('course-prev','Previous module')+btn('course-complete',courseCompletion.has(id+':'+m)?'Mark incomplete':'Mark complete')+btn('course-next','Next module',true)+'</div></div>';

function courseDeep(name,sections,heads,rows,topology,steps,config,expected,question,choices,answer,reason,tools,reference){COURSE_DEEP[name]={sections,heads,rows,topology,steps,config,expected,question,choices,answer,reason,tools,reference};}
courseDeep('OSI & TCP/IP',[
['Layers and encapsulation','Application data is carried in a TCP segment or UDP datagram, then an IP packet and a link frame. OSI layers 5–7 generally map to TCP/IP application, layer 4 to transport, layer 3 to internet, and 1–2 to link. A switch learns source MACs; a router looks up the destination IP. These are different forwarding decisions.'],
['IPv4 header reference','Version and IHL identify the format and header size. DSCP/ECN describe traffic treatment and congestion. Total Length includes header and payload. Identification, flags and Fragment Offset support fragmentation. TTL limits hops; Protocol identifies the next header. The checksum covers the IPv4 header, not its payload. Source/destination addresses usually remain stable without NAT. Options can increase the header from 20 to 60 bytes. IPv6 has a 40-byte base header.'],
['Worked fragmentation','A 20-byte IPv4 header with 4000 payload bytes meets a 1500-byte MTU with DF clear. Non-final payload capacity is floor((1500−20)/8)×8 = 1480. Payloads are 1480,1480,1040; total lengths 1500,1500,1060. Offsets are 0,185,370 in eight-byte units; MF is 1,1,0. With DF set, a forwarding router drops the oversized packet and reports fragmentation needed when permitted.'],
['Troubleshooting by evidence','Check link state, then VLAN/MAC/ARP, IP/gateway/routes, transport exchanges and application responses. Compare captures on both sides of a router. A timeout does not identify a layer by itself.']
],['Layer','PDU / identifiers'],[['1–2','Bits / frames; MAC and VLAN'],['3','Packets; addresses and TTL'],['4','Segments/datagrams; ports and sequence'],['5–7','Application data; DNS/TLS/HTTP']],'Host A 192.0.2.10 → R1 → R2 → Host B 198.51.100.10',['Assign /24 LANs, /30 transit and gateways.','Install forward and return routes.','Capture an echo and a TCP connection on both LANs. Compare MACs, IPs and TTL.','Set a wrong gateway, identify the first failed step, restore and retest.'],'# Host observations\nip route\nip neigh\n# Wireshark display filters\nicmp || tcp\nip.ttl == 1','Routed hops replace link headers and decrement TTL. Ordinary routing preserves the destination IP.','What changes at a routed hop?', ['The destination IP always changes','The link header changes and TTL decreases','TCP destination port always changes'],1,'Routing rewrites link encapsulation and decrements TTL; NAT can add other changes.',['decoder','mtu','tracer'],'https://www.rfc-editor.org/rfc/rfc791');
courseDeep('Ethernet & ARP',[
['Ethernet bytes','Ethernet II carries destination MAC (6 bytes), source MAC (6), EtherType (2), payload and FCS (4). An 802.1Q tag adds 4 bytes. Preamble/SFD use 8 bytes on the wire, and the interpacket gap consumes time. A minimum untagged frame is 64 bytes from destination MAC through FCS. Host offload can hide tags/FCS or distort observed sizes.'],
['ARP packet and next-hop resolution','Ethernet/IPv4 ARP uses hardware type 1, protocol 0x0800, lengths 6 and 4, and request/reply opcodes 1/2. Requests normally broadcast; replies normally unicast. On-link traffic resolves the destination; off-link traffic resolves the gateway. Gratuitous announcements can refresh caches after a move. Proxy ARP answers for another node; it does not make remote broadcasts cross routers.'],
['Physical counters and security','CRC/FCS errors need cabling, optics and peer checks. Late collisions can indicate duplex mismatch in legacy half-duplex cases; normal switched full-duplex does not use CSMA/CD collision recovery. Read counter deltas during a repeatable test. ARP cache entries are not authenticated identities: snooping/DAI can validate bindings when trust and static exceptions are planned.']
],['Field','Value / role'],[['IPv4 / ARP / IPv6 EtherType','0x0800 / 0x0806 / 0x86DD'],['ARP request / reply','1 / 2'],['Off-subnet ARP target','Local gateway'],['Switch learning','Source MAC and ingress VLAN/port']],'PC-A — SW1 — gateway 192.0.2.1',['Clear only the lab host neighbor cache; ping the gateway.','Capture request and reply fields.','Ping a remote host and confirm the first-hop gateway MAC.','Move the client to a wrong VLAN, observe failure, restore it.'],'arp\narp.opcode == 1\narp.opcode == 2\nshow mac address-table\nshow ip arp\nshow interfaces counters errors','ARP stays local to the VLAN; remote IP traffic uses the gateway MAC on the first link.','Which IP is resolved for a remote destination?', ['The local gateway','The remote host MAC across the WAN','Any DNS server'],0,'ARP resolves a local-link IPv4 next hop.',['arp','mac'],'https://www.rfc-editor.org/rfc/rfc826');
courseDeep('Switching & STP',[
['Root and port decisions','The lowest bridge ID becomes root. A non-root bridge selects a root port by the best advertised root path and BPDU tie-breaks. Each segment selects a designated port. An alternate path stops forwarding ordinary data so redundant links cannot circulate frames indefinitely. Bridge priority, extended system ID, MAC, cost and sender identifiers explain the outcome.'],
['BPDUs, states and rapid convergence','BPDUs advertise root ID, cost, bridge/port IDs and timers. Classic STP uses blocking, listening, learning and forwarding. RSTP uses discarding, learning and forwarding with root/designated/alternate/backup roles. Proposal/agreement and edge behavior enable faster transitions under their conditions. Failover is not a universal zero-loss guarantee.'],
['PVST+, MST and protections','PVST+ computes per-VLAN trees; MST maps VLANs into instances. MST region name, revision and VLAN mapping must agree. Set primary/secondary roots deliberately. PortFast/edge behavior belongs on appropriate endpoint ports; BPDU guard, root guard and loop guard address different risks. Do not make inter-switch links edge ports without a justified design.'],
['VLAN and port-channel consistency','Native and allowed VLAN settings must align. VTP changes can have broad scope. Inspect the VLAN-specific tree and the logical port-channel together; several physical members can represent a single STP link.']
],['Choice','Rule'],[['Root','Lowest bridge ID'],['Root port','Lowest path, then BPDU tie-breaks'],['Designated','Best BPDU on segment'],['Alternate','Backup toward root']],'SW1 — SW2 — SW3 — SW1; VLANs 10 and 20',['Find the initial root and alternate link.','Lower SW1 priority for VLAN 10 and verify agreement.','Change one uplink cost and predict the new root port.','Fail a forwarding link; measure transitions and restore.'],'spanning-tree mode rapid-pvst\nspanning-tree vlan 10 priority 4096\nshow spanning-tree vlan 10\nshow spanning-tree detail','A loop-free tree with root and roles that follow the configured costs and IDs.','At equal cost, which sender bridge ID is preferred?', ['Higher','Lower','Last received'],1,'The lower sender bridge ID wins before sender port ID.',['stp','vlan'],'https://www.cisco.com/c/en/us/tech/lan-switching/spanning-tree-protocol/index.html');
courseDeep('IP Routing',[
['Mask math and longest prefix','192.0.2.70/26 belongs to .64–.127, with conventional usable hosts .65–.126. A /25 route beats a /24 for matching destinations regardless of the /24’s lower administrative distance. Preferences compare competing candidates for the same prefix; forwarding then chooses the longest installed prefix.'],
['RIB, CEF and adjacency','The RIB selects routes. CEF programs the FIB and adjacency/rewrite data. A recursive next hop must resolve to a usable path. A connected prefix can exist while a particular neighbor remains unresolved. Decode route code, prefix, preference/metric, next hop and interface separately.'],
['Static, default, PBR and redistribution','A default is fallback to less-specific destinations; a floating static is deliberately less preferred. A discard summary prevents some recursion/loop problems but drops uncovered component destinations. PBR can change normal destination-based decisions for selected traffic. Redistribution needs prefix boundaries, seed metrics and feedback controls.']
],['Cisco route source','Common IPv4 preference'],[['Connected / static','0 / 1'],['eBGP / internal EIGRP','20 / 90'],['OSPF / IS-IS / RIP','110 / 115 / 120'],['External EIGRP / iBGP','170 / 200']],'LAN-A — R1 — R2 — R3 — LAN-B',['Address transit links and LANs.','Install forward and return statics.','Compare a default and more-specific route.','Break only the return route and explain why the forward path is insufficient.'],'ip route 198.51.100.0 255.255.255.0 10.0.12.2\nip route 198.51.100.0 255.255.255.0 10.0.13.3 200\nshow ip route 198.51.100.10\nshow ip cef 198.51.100.10','Most-specific usable installed prefix selects forwarding; replies also need return reachability.','A /24 static and /25 OSPF route both match. Which prefix forwards?', ['The /24','The /25','They always form ECMP'],1,'Longest prefix wins across installed prefixes.',['routes','ipv4','vlsm','topology'],'https://www.rfc-editor.org/rfc/rfc1812');
courseDeep('TCP & UDP',[
['Header and sequence arithmetic','TCP includes ports, sequence/ACK numbers, header length, flags, receive window, checksum, urgent pointer and options. SYN at sequence 100 is acknowledged by 101. Then 300 bytes starting at 101 lead to ACK 401. FIN also consumes sequence space; an empty ACK does not. UDP has an 8-byte header with ports, length and checksum.'],
['Options, flow and congestion','MSS advertises a receive segment-size bound, not path MTU. Window scaling and SACK permission are negotiated in SYNs. SACK reports received ranges. Receiver window provides flow control; congestion control regulates network load. Slow start, AIMD, CUBIC and BBR differ by endpoint implementation. Useful flight size is limited by both congestion and receive windows.'],
['States, closure and captures','Track SYN-SENT/SYN-RECEIVED/ESTABLISHED and closing states such as FIN-WAIT, CLOSE-WAIT, LAST-ACK and TIME-WAIT. FIN closes orderly; RST aborts. TIME-WAIT protects against old segments and final-ACK loss. Repeated SYNs do not identify the dropping device. Host offload can produce apparent bad checksums or large segments. DNS may use UDP or TCP; QUIC uses UDP but supplies higher-layer reliability and congestion control.']
],['Observation','Investigate'],[['Repeated SYN','Path, policy, service, capture gap'],['Zero window','Receiver pressure'],['Dup ACK / SACK','Loss or reordering'],['TIME-WAIT','Normal closure and old-segment protection']],'Client — routed path — server:443',['Capture SYN/SYN-ACK/ACK.','Calculate ACK progression for a short transfer.','Introduce lab-only loss and identify recovery evidence.','Compare orderly FIN closure with an aborted connection.'],'tcp.flags.syn == 1\ntcp.analysis.retransmission\ntcp.analysis.zero_window\ntcp.flags.reset == 1\nss -tan','Sequence/ACK arithmetic follows bytes plus SYN/FIN; state and retransmissions explain recovery.','SYN sequence 100, then 300 bytes at 101: expected ACK?', ['300','400','401'],2,'SYN consumes one sequence number; bytes 101–400 lead to ACK 401.',['tcp','tcp-state','capture'],'https://www.rfc-editor.org/rfc/rfc9293');
courseDeep('DHCP & DNS',[
['Lease packet fields and options','Discover, Offer, Request and ACK associate a client with a lease. Transaction ID, client identity, requested address and server identifier relate messages. Options include mask (1), gateway (3), resolver (6), lease (51), type (53) and server ID (54). T1/T2 govern renewal/rebinding, often defaulting to half and seven-eighths of the lease if not supplied. Initial discovery and renewal differ.'],
['Relay and subnet selection','A relay carries requests across the broadcast boundary and supplies subnet context such as giaddr. The server needs a matching pool, and relay/server need bidirectional reachability. Inspect options separately: receiving an address does not prove correct gateway or DNS.'],
['Hierarchy, cache and record analysis','Recursive resolvers follow delegation and cache results; authoritative servers supply zone data. A/AAAA hold addresses, CNAME aliases, NS delegation, MX mail, PTR reverse names and TXT text. TTL governs caches, not instantaneous application updates. Decode transaction ID, name/type, flags, response code, answer, TTL and truncation. Distinguish NXDOMAIN from SERVFAIL or timeout. Truncation can require TCP.']
],['Exchange','Ports / evidence'],[['DHCPv4','Client UDP 68, server UDP 67'],['DNS','UDP/TCP 53'],['Lease','Address plus options'],['Negative DNS','Response code versus no reply']],'Client VLAN 10 — relay — DHCP/DNS server',['Create a pool for the client VLAN.','Capture DORA and record all supplied options.','Resolve a record twice; compare cache behavior.','Break the relay return path, then restore and test DNS independently.'],'interface GigabitEthernet0/0\n ip address 192.0.2.1 255.255.255.0\n ip helper-address 198.51.100.20\nshow ip dhcp binding\nnslookup lab.example\n# Wireshark\ndhcp || dns','Correct lease/options and independently working resolver exchange.','Lease and IP ping work but names fail. Inspect?', ['Only cable','DNS configuration and exchange','Immediately change subnet'],1,'Inspect resolver and DNS responses once address connectivity is established.',['dhcp','relay','dns'],'https://www.rfc-editor.org/rfc/rfc2131');

const PATHS=[['Addressing','ipv4','Turn bits into a working address plan.'],['Routing','topology','Explore paths, policies and failures.'],['Wireless','wifi-rf','Connect signal budgets to RF decisions.'],['Operations','capture','Investigate evidence before making a change.'],['Practice','broken','Build confidence with failure scenarios.']];
function workshopRender(id){const ids=['home','wifi-rf','ndp','qos','capture','automation'];if(!ids.includes(id))return false;if(id==='home'){document.getElementById('surface').innerHTML='<section class="workshop-hero"><div><span class="eyebrow">THE NETWORK WORKSHOP / PARAM CHAWLA</span><h2>Understand the path.<br>Build with confidence.</h2><p>A personal workbench for the engineer who wants to know why a network works—and where it breaks.</p><button class="primary" data-jump="wifi-rf">Explore the wireless lab →</button></div><div class="desk-art" aria-hidden="true"><span>01 / OBSERVE</span><div>HOST ─── SWITCH<br>│ &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; │<br>AP ───── ROUTER</div><span>02 / TEST &nbsp; 03 / EXPLAIN</span></div></section><div class="path-grid">'+PATHS.map(([t,d,s],i)=>'<button class="path-card" data-jump="'+d+'"><span>0'+(i+1)+'</span><h3>'+t+'</h3><p>'+s+'</p><strong>Open workbench ↗</strong></button>').join('')+'</div>'+card('New on the workbench','<div class="new-labs">'+ids.slice(1).map(d=>'<button data-jump="'+d+'">'+esc(PAGES.find(p=>p.id===d).title)+' ↗</button>').join('')+'</div>')+card('A way to practice', '<div class="grid equal"><div><h3>Learn → Experiment → Troubleshoot</h3><p>Choose a model. Change one variable. Predict the outcome before running it. Explain the result, then introduce a failure.</p></div><div><h3>Your field notes</h3><p>Write down the symptom, the evidence and the smallest change that fixes it. A successful test is stronger than a guessed configuration.</p></div></div>');document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>navigate(b.dataset.jump));return true;}
if(id==='wifi-rf'){ $('surface').innerHTML=card('Learn · A link budget is a starting point', '<p>Received power follows transmit power + antenna gains − path loss − other losses. Free-space loss assumes an unobstructed path; walls, fading, interference and receiver characteristics need separate measurements.</p>')+card('Experiment · RF link budget','<div class="fields">'+input('rf-f','Frequency (MHz)',5180,'number')+input('rf-d','Distance (metres)',20,'number')+input('rf-t','Transmit power (dBm)',20,'number')+input('rf-g','Combined antenna gain (dBi)',4,'number')+input('rf-l','Other losses (dB)',10,'number')+input('rf-n','Noise floor (dBm)',-95,'number')+'</div>'+btn('rf-run','Calculate budget',true)+out())+card('Troubleshoot · Before raising power','<p>Check channel utilization, retries, client transmit capability and roaming. A strong AP signal does not guarantee a healthy return path. Validate on site; this model predicts neither data rate nor coverage.</p>');const run=()=>{const f=+$('rf-f').value,d=+$('rf-d').value;if(f<=0||d<=0)throw Error('Use a positive frequency and distance.');const loss=20*Math.log10(d/1000)+20*Math.log10(f)+32.44,p=+$('rf-t').value+ +$('rf-g').value-loss- +$('rf-l').value;$('output').innerHTML=stats([['Free-space path loss',loss.toFixed(1)+' dB'],['Estimated received power',p.toFixed(1)+' dBm'],['Estimated SNR',(p- +$('rf-n').value).toFixed(1)+' dB']]);};action('rf-run',run);run();}
if(id==='ndp'){let step=0;const scenes=[['Resolve the next hop','A host chooses an on-link destination or its default router. Router advertisements and prefix information influence that decision.'],['Neighbor Solicitation','An ICMPv6 NS targets the neighbor’s solicited-node multicast group. IPv6 uses NDP rather than ARP.'],['Neighbor Advertisement','The target responds with an NA and link-layer information. The sender updates its neighbor cache.'],['Reachability state','The cache can transition from REACHABLE to STALE, then DELAY and PROBE when reachability needs confirmation.']];$('surface').innerHTML=card('Learn · IPv6 on the local link','<p>NDP includes address resolution, router and prefix discovery, duplicate address detection and neighbor reachability. This walk focuses on address resolution.</p>')+card('Experiment · Derive a multicast destination','<div class="fields">'+input('nd-address','Target IPv6 address','2001:db8::1234:5678')+'</div>'+btn('nd-run','Derive solicited-node address',true)+out()+ '<div class="actions">'+btn('nd-prev','Previous step')+btn('nd-next','Next step')+'</div><div id="nd-scene"></div>')+card('Troubleshoot · NS with no NA','<p>Check the target address, VLAN membership, multicast delivery and ICMPv6 filtering. DAD uses an unspecified source address and serves a different purpose from normal neighbor resolution.</p>');const draw=()=>{$('nd-scene').innerHTML='<div class="eyebrow">Step '+(step+1)+' / 4</div><h3>'+scenes[step][0]+'</h3><p>'+scenes[step][1]+'</p>';};const run=()=>{const expanded=Net.expand6($('nd-address').value).join(':');const hex=expanded.replace(/:/g,'').slice(-6);$('output').innerHTML=stats([['Solicited-node multicast','ff02::1:ff'+hex.slice(0,2)+':'+hex.slice(2)],['Ethernet multicast','33:33:ff:'+hex.match(/../g).join(':')]]);};action('nd-run',run);action('nd-next',()=>{step=(step+1)%4;draw();});action('nd-prev',()=>{step=(step+3)%4;draw();});run();draw();}
if(id==='qos'){$('surface').innerHTML=card('Learn · Delay before priority','<p>Serialization delay is the time required to put a packet onto a link. Queueing adds waiting time. Marking DSCP alone does not create a scheduling policy or additional capacity.</p>')+card('Experiment · A simplified FIFO queue','<div class="fields">'+input('q-rate','Link speed (Mbps)',10,'number')+input('q-size','Packet size (bytes)',1500,'number')+input('q-backlog','Bytes queued ahead',60000,'number')+'</div>'+btn('q-run','Estimate delay',true)+out())+card('Troubleshoot · Real-time traffic','<p>Measure congestion and loss, verify the trust boundary and classify traffic intentionally. Priority queues need capacity and policing limits; otherwise other traffic can starve. This FIFO model excludes propagation, processing and encapsulation overhead.</p>');const run=()=>{const rate=+$('q-rate').value,size=+$('q-size').value,back=+$('q-backlog').value;if(rate<=0||size<=0||back<0)throw Error('Use positive speed and size, and a non-negative queue.');$('output').innerHTML=stats([['Serialization', (size*8/(rate*1000)).toFixed(3)+' ms'],['Queue waiting',(back*8/(rate*1000)).toFixed(3)+' ms'],['Total modeled delay',((size+back)*8/(rate*1000)).toFixed(3)+' ms']]);};action('q-run',run);run();}
if(id==='capture'){const cases=[['Repeated SYN, no reply','0.000 Client → Server SYN\n1.000 Client → Server SYN (retry)\n3.000 Client → Server SYN (retry)','No response is visible. Check capture location, forward/return routing, filtering and server availability. The trace alone does not identify which one failed.'],['TCP reset after SYN','0.000 Client → Server SYN\n0.012 Server → Client RST, ACK','A reset is visible. Verify its source and whether a listener exists; a middlebox may also generate a reset.'],['DNS reply, connection timeout','0.000 Client → DNS Query A example.test\n0.010 DNS → Client Answer 203.0.113.10\n0.015 Client → 203.0.113.10 SYN\n1.015 Client → 203.0.113.10 SYN (retry)','Name resolution succeeded in this scene. Investigate transport reachability separately; an answer does not prove the destination service is reachable.']];$('surface').innerHTML=card('Learn · Evidence before diagnosis','<p>Capture at a useful point, record timestamps and identify what the trace can and cannot prove. These are synthetic traces, not an uploaded PCAP analyzer.</p>')+card('Experiment · Investigate a trace',select('cap-case','Scenario',cases.map((x,i)=>[i,x[0]]))+out()+btn('cap-reveal','Reveal investigation notes',true)+'<div id="cap-notes"></div>')+card('Troubleshoot · Capture quality','<p>Check packet drops, snap length, clock alignment and whether both directions are visible. Retransmissions inferred from a partial capture can be misleading.</p>');const run=()=>{$('output').innerHTML='<pre>'+esc(cases[+$('cap-case').value][1])+'</pre>';$('cap-notes').innerHTML='';};$('cap-case').onchange=run;action('cap-reveal',()=>{$('cap-notes').innerHTML=hint(cases[+$('cap-case').value][2]);});run();}
if(id==='automation'){$('surface').innerHTML=card('Learn · Make the change reviewable','<p>A repeatable change starts with explicit intent, bounded targets, pre-checks and rollback. This planner creates local notes; it does not connect to devices or run commands.</p>')+card('Experiment · Change plan',area('a-target','Targets (one per line)','R1\nR2')+area('a-intent','Desired change','Apply a reviewed management ACL')+area('a-pre','Pre-change evidence','Record current ACL and management reachability')+area('a-post','Post-change verification','Verify permitted management access and denied test traffic')+area('a-rollback','Rollback procedure','Restore the saved ACL if approved checks fail')+btn('a-run','Build review plan',true)+out()+btn('a-save','Download plan'))+card('Troubleshoot · Partial success','<p>Define stop conditions before execution. Check for out-of-band access, staged rollout and configuration drift. Never include passwords or private keys in exported plans.</p>');const run=()=>{const targets=$('a-target').value.split(/\n/).map(x=>x.trim()).filter(Boolean);if(!targets.length||!$('a-intent').value.trim()||!$('a-rollback').value.trim())throw Error('Provide targets, change intent and rollback.');const plan={owner:'Param Chawla',targets,intent:$('a-intent').value,precheck:$('a-pre').value,postcheck:$('a-post').value,rollback:$('a-rollback').value,stopCondition:'Stop rollout when a verification fails; investigate before continuing.'};$('output').innerHTML='<pre>'+esc(JSON.stringify(plan,null,2))+'</pre>';return plan;};action('a-run',run);action('a-save',()=>download('network-change-plan.json',JSON.stringify(run(),null,2)));run();}return true;}
