const Net = (() => {
 const ip = s => { if(typeof s!=='string'||!/^\d+\.\d+\.\d+\.\d+$/.test(s.trim()))throw Error('Enter four decimal octets separated by dots.'); const a=s.trim().split('.').map(Number); if(a.some(n=>n<0||n>255))throw Error('IPv4 octets must be between 0 and 255.'); return a.reduce((v,n)=>v*256+n,0); };
 const str = n => [24,16,8,0].map(b=>Math.floor(n/2**b)%256).join('.');
 const subnet=(s,p)=>{if(p===undefined){const a=s.split('/');if(a.length!==2)throw Error('Use CIDR notation, for example 192.168.10.0/26.');[s,p]=a;} if(!/^\/?\d+$/.test(String(p)))throw Error('Prefix must be an integer from 0 to 32.');p=Number(String(p).replace('/',''));if(p<0||p>32)throw Error('Prefix must be between 0 and 32.');const n=ip(s),size=2**(32-p),start=Math.floor(n/size)*size,end=start+size-1;return{ip:s,p,size,start,end,network:str(start),broadcast:p<31?str(end):'Not used',lastAddress:str(end),first:str(start+(p<31?1:0)),last:str(end-(p<31?1:0)),hosts:p<31?size-2:size,mask:str(2**32-size),wildcard:str(size-1),cidr:str(start)+'/'+p};};
 const binary=n=>str(n).split('.').map(x=>Number(x).toString(2).padStart(8,'0')).join('.');
 const classify=s=>{const n=ip(s),a=Number(s.split('.')[0]);let type='Unicast (check special-purpose registry for routing eligibility)';if(a===10||(n>=ip('172.16.0.0')&&n<=ip('172.31.255.255'))||(n>=ip('192.168.0.0')&&n<=ip('192.168.255.255')))type='Private (RFC 1918)';else if(a===127)type='Loopback';else if(n>=ip('169.254.0.0')&&n<=ip('169.254.255.255'))type='Link-local';else if(a===0)type='This network / unspecified';else if(a>=224&&a<=239)type='Multicast';else if(a>=240)type='Reserved / limited broadcast';else if([['192.0.2.0',24],['198.51.100.0',24],['203.0.113.0',24]].some(([s,p])=>{const b=subnet(s,p);return n>=b.start&&n<=b.end;}))type='Documentation (RFC 5737)';return{class:a<128?'A':a<192?'B':a<224?'C':a<240?'D':'E',type};};
 const list=s=>{const a=s.trim().split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);if(!a.length)throw Error('Enter at least one CIDR block.');return a.map(x=>subnet(x));};

</script><script>function renderModule(id){const f={binary:binaryLab,classes:classesLab,masks:maskLab,cidr:cidrLab,tree:treeLab,vlsm:vlsmLab,overlap:aggregateLab,supernet:aggregateLab,summary:aggregateLab,'ospf-summary':aggregateLab,ipv6:ipv6Lab,password:passwordLab,mac:macLab,units:unitsLab,wireguard:wireguardLab,ping:pingLab,asn:asnLab,'asn-ref':asnLab,ports:portsLab,mtu:mtuLab,tunnel:tunnelLab,vlan:vlanLab,eigrp:eigrpLab,'tcp-state':tcpStateLab,tracer:packetTraceLab};if(f[id])return f[id](id);if(SCENARIOS[id])return simulationLab(id);if(typeof routingModule==='function'&&routingModule(id))return;if(typeof learningModule==='function'&&learningModule(id))return;throw Error('This lab is not configured.');}
function binaryLab(){$('surface').innerHTML=card('Decimal ↔ binary',`<div class="fields">${input('dec','Decimal octet',192,'number','min="0" max="255"')}${input('bin','8-bit binary','11000000')}</div>${out('builder')}${out()}`)+card('Bitwise AND',`<div class="fields">${input('and-ip','IP address','192.168.10.74')}${input('and-mask','Mask','255.255.255.0')}</div>${btn('and','Calculate AND',true)}${out('and-result')}`);const draw=n=>{if(!Number.isInteger(n)||n<0||n>255)throw Error('Use an integer from 0 to 255.');$('dec').value=n;$('bin').value=n.toString(2).padStart(8,'0');$('builder').innerHTML=`<div class="bits">${Array.from({length:8},(_,i)=>`<button class="bit ${n&(1<<(7-i))?'':'host'}" data-bit="${7-i}" aria-label="Toggle bit ${7-i}">${n>>(7-i)&1}</button>`).join('')}</div><div class="bits">${[128,64,32,16,8,4,2,1].map(n=>`<span style="flex:1;text-align:center;color:var(--muted);font-size:13px">${n}</span>`).join('')}</div>`;$('output').innerHTML=hint(`Active bit weights: ${[128,64,32,16,8,4,2,1].filter(v=>n&v).join(' + ')||'0'} = <strong>${n}</strong>.`);$('builder').querySelectorAll('button').forEach(b=>b.onclick=()=>draw(n^(1<<Number(b.dataset.bit))));};$('dec').oninput=()=>safe(()=>draw(Number($('dec').value)));$('bin').onchange=()=>safe(()=>{if(!/^[01]{8}$/.test($('bin').value))throw Error('Enter exactly eight binary digits.');draw(parseInt($('bin').value,2));});action('and',()=>{const a=Net.ip($('and-ip').value),m=Net.ip($('and-mask').value),r=(a&m)>>>0;$('and-result').innerHTML=`<pre>IP       ${Net.binary(a)}\nMask     ${Net.binary(m)}\nResult   ${Net.binary(r)}\n\n${Net.str(r)}</pre>`;});draw(192);$('and').click();}
function classesLab(){$('surface').innerHTML=card('Address classification',`<div class="fields">${input('class-ip','IPv4 address','172.20.10.1')}</div>${btn('classify','Inspect address',true)}${out()}`)+card('Historical class boundaries',table(['Class','First octet','Default prefix','Purpose'],[['A','1–126','/8','Historical unicast'],['B','128–191','/16','Historical unicast'],['C','192–223','/24','Historical unicast'],['D','224–239','—','Multicast'],['E','240–255','—','Reserved']])+hint('Modern routing uses CIDR. An address ending in .0 or .255 can be a usable host depending on its actual subnet mask.'))+card('Private and special ranges',table(['Prefix','Meaning'],[['10.0.0.0/8','Private'],['172.16.0.0/12','Private'],['192.168.0.0/16','Private'],['127.0.0.0/8','Loopback'],['169.254.0.0/16','Link-local'],['192.0.2.0/24','Documentation'],['198.51.100.0/24','Documentation'],['203.0.113.0/24','Documentation']]));action('classify',()=>{const c=Net.classify($('class-ip').value);$('output').innerHTML=stats([['Historical class',c.class],['Category',c.type],['Binary address',Net.binary(Net.ip($('class-ip').value)),'full']]);});$('classify').click();}
function maskLab(){$('surface').innerHTML=card('Prefix boundary',input('mask-p','Prefix length',24,'range','min="0" max="32" step="1"')+out('mask-bits')+out());const run=()=>{const n=Net.subnet('0.0.0.0',$('mask-p').value);$('mask-bits').innerHTML=`<h3>/${n.p} · ${n.mask}</h3>`+bitMap(Net.ip(n.mask),n.p);$('output').innerHTML=stats([['Network bits',n.p],['Host bits',32-n.p],['Block size',n.size.toLocaleString()],['Usable addresses',n.hosts.toLocaleString()],['Wildcard mask',n.wildcard,'full']]);};$('mask-p').oninput=run;run();}
function cidrLab(){$('surface').innerHTML=card('Block explorer',`<div class="fields">${input('cidr','CIDR block','172.16.0.0/20')}${input('child-p','Split into prefix',24,'number','min="0" max="32"')}</div>${btn('divide','Explore & divide',true)}${out()}`);action('divide',()=>{const b=Net.subnet($('cidr').value),p=Number($('child-p').value);if(!Number.isInteger(p)||p<b.p||p>32)throw Error('Child prefix must be at least the parent prefix and at most 32.');const count=2**(p-b.p);$('output').innerHTML=stats([['Normalized block',b.cidr],['Final address',b.lastAddress],['Equal subnets',count.toLocaleString()],['Addresses per child',(2**(32-p)).toLocaleString()]])+hint(count>256?'Showing the first 256 subnets.':'Each child covers an equally sized, aligned block.')+table(['CIDR','Usable range','Hosts'],Array.from({length:Math.min(count,256)},(_,i)=>{const n=Net.subnet(Net.str(b.start+i*2**(32-p)),p);return[n.cidr,n.first+' – '+n.last,n.hosts.toLocaleString()];}));});$('divide').click();}
function treeLab(){$('surface').innerHTML=card('Starting block',`<div class="fields">${input('tree-base','Network','192.168.10.0/24')}</div>${btn('tree-build','Build tree',true)}${out()}`);let blocks=[];const draw=()=>{$('output').innerHTML=table(['Subnet','Mask','Address range','Usable','Actions'],blocks.map((n,i)=>[n.cidr,n.mask,n.network+' – '+n.lastAddress,n.hosts,`<button data-split="${i}" ${n.p===32?'disabled':''}>Split</button> <button data-join="${i}" ${n.p===Net.subnet($('tree-base').value).p?'disabled':''}>Join siblings</button>`]));$('output').querySelectorAll('[data-split]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.split),n=blocks[i];blocks.splice(i,1,Net.subnet(n.network,n.p+1),Net.subnet(Net.str(n.start+n.size/2),n.p+1));draw();});$('output').querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>safe(()=>{const i=Number(b.dataset.join),n=blocks[i],parent=Net.subnet(n.network,n.p-1);const siblings=blocks.filter(x=>x.p===n.p&&x.start>=parent.start&&x.end<=parent.end);if(siblings.length!==2)throw Error('Join the smaller descendants first so both siblings have the same prefix.');blocks=blocks.filter(x=>!siblings.includes(x));blocks.push(parent);blocks.sort((a,b)=>a.start-b.start);draw();}));};action('tree-build',()=>{blocks=[Net.subnet($('tree-base').value)];draw();});$('tree-build').click();}
function vlsmLab(){$('surface').innerHTML=card('Plan address space',`<div class="fields">${input('vlsm-base','Base block','192.168.10.0/24')}</div><div id="requirements"></div><div class="actions">${btn('add-req','Add subnet')}${btn('allocate','Allocate largest first',true)}</div>${out()}`);let n=0;const add=(name,hosts)=>{const row=document.createElement('div');row.className='fields';row.innerHTML=input('req-name-'+n,'Subnet name',name)+input('req-host-'+n,'Hosts needed',hosts,'number','min="1"')+`<button aria-label="Remove subnet">Remove</button>`;row.querySelector('button').onclick=()=>row.remove();$('requirements').append(row);n++;};add('Users',100);add('Servers',50);add('Management',12);action('add-req',()=>add('Subnet '+(n+1),10));action('allocate',()=>{const rows=[...$('requirements').children];if(!rows.length)throw Error('Add at least one subnet requirement.');const req=rows.map(r=>({name:r.querySelector('input').value,hosts:Number(r.querySelector('input[type=number]').value)}));const a=Net.vlsm(Net.subnet($('vlsm-base').value),req);$('output').innerHTML=table(['Name','Required','CIDR','Usable range','Capacity'],a.map(x=>[esc(x.name),x.required,x.cidr,x.first+' – '+x.last,x.size-2]))+hint('Larger blocks are allocated first to preserve alignment. These allocations reserve network and broadcast addresses.');});$('allocate').click();}
function aggregateLab(id){const overlaps=id==='overlap',title=overlaps?'Check address ranges':'Aggregate prefixes';$('surface').innerHTML=card(title,area('prefixes','CIDR blocks, one per line',overlaps?'192.168.10.0/24\n192.168.10.128/25\n10.0.0.0/8':'192.168.0.0/24\n192.168.1.0/24\n192.168.2.0/24\n192.168.3.0/24')+`<div class="actions">${btn('aggregate',overlaps?'Check every pair':'Calculate summaries',true)}${btn('aggregate-copy','Copy result')}</div>`+out());let text='';action('aggregate',()=>{const a=Net.list($('prefixes').value);if(overlaps){const o=Net.overlap(a);text=o.map(r=>r.join(' | ')).join('\n')||'No overlaps.';$('output').innerHTML=o.length?table(['Network A','Network B','Overlap start','Overlap end'],o):hint('No overlapping address ranges were found.');}else{const n=Net.summarize(a),exact=Net.merge(a),covered=exact.reduce((s,b)=>s+b.size,0);text=exact.map(b=>b.cidr).join('\n');$('output').innerHTML=stats([['Covering aggregate',n.cidr,'highlight'],['Included addresses',n.size.toLocaleString()],['Input coverage',covered.toLocaleString()],['Extra addresses',(n.size-covered).toLocaleString()]])+hint(n.size>covered?'The covering summary includes space absent from the input. Exact summaries below preserve only the supplied coverage.':'The covering summary exactly matches the supplied address space.')+table(['Exact aggregate','Mask','Address count'],exact.map(b=>[b.cidr,b.mask,b.size.toLocaleString()]))+`<pre>${esc(exact.map(b=>id==='ospf-summary'?`area 1 range ${b.network} ${b.mask}`:`ip route ${b.network} ${b.mask} Null0`).join('\n'))}</pre>`;}});action('aggregate-copy',()=>copy(text));$('aggregate').click();}
function ipv6Lab(){$('surface').innerHTML=`<div class="chips" id="v6-tabs">${['Address analyzer','Subnetting','EUI-64 / SLAAC','Transition','Reference'].map((x,i)=>`<button data-v6="${i}">${x}</button>`).join('')}</div><div id="v6-panel" style="margin-top:20px"></div>`;const page=i=>{if(i===0){$('v6-panel').innerHTML=card('Analyze and normalize',input('v6','IPv6 address','2001:db8:85a3::8a2e:370:7334')+`<div class="actions">${btn('v6-run','Analyze',true)}</div>`+out());action('v6-run',()=>{const a=Net.expand6($('v6').value),n=Net.int6($('v6').value),first=parseInt(a[0],16);let type=n===0n?'Unspecified':n===1n?'Loopback':(first&0xff00)===0xff00?'Multicast':(first&0xffc0)===0xfe80?'Link-local':(first&0xfe00)===0xfc00?'Unique local':(first&0xe000)===0x2000?'Global-unicast allocation space':'Other / special-purpose';if(a[0]==='2001'&&a[1]==='0db8')type='Documentation (2001:db8::/32)';$('output').innerHTML=stats([['Expanded',a.join(':'),'full'],['Compressed',Net.compress6(a),'full'],['Address type',type],['Length','128 bits'],['Reverse PTR',a.join('').split('').reverse().join('.')+'.ip6.arpa','full']])+`<pre>${a.map(x=>parseInt(x,16).toString(2).padStart(16,'0')).join('\n')}</pre>`;});$('v6-run').click();}else if(i===1){$('v6-panel').innerHTML=card('Divide IPv6 space',`<div class="fields">${input('v6-base','Parent prefix','2001:db8::/48')}${input('v6-child','Child prefix',64,'number','min="0" max="128"')}</div>${btn('v6-divide','Divide',true)}${out()}`);action('v6-divide',()=>{const b=Net.subnet6($('v6-base').value),p=Number($('v6-child').value);if(!Number.isInteger(p)||p<b.p||p>128)throw Error('Child prefix must be between the parent prefix and 128.');const count=1n<<BigInt(p-b.p),size=1n<<BigInt(128-p);$('output').innerHTML=stats([['Parent network',b.cidr,'full'],['Child networks',count.toString()],['Addresses per child',size.toString()]])+hint('Showing at most 128 child prefixes. IPv6 uses multicast rather than broadcast.')+table(['Child prefix'],Array.from({length:Number(count>128n?128n:count)},(_,j)=>[Net.str6(b.start+BigInt(j)*size)+'/'+p]));});$('v6-divide').click();}else if(i===2){$('v6-panel').innerHTML=card('Modified EUI-64 interface ID',`<div class="fields">${input('eui-mac','MAC address','02:11:22:33:44:55')}${input('eui-prefix','Network /64','2001:db8:1::/64')}</div>${btn('eui','Build address',true)}${out()}`+hint('Modern clients often use stable or temporary privacy addresses instead of MAC-derived EUI-64.'));action('eui',()=>{const m=Net.mac($('eui-mac').value).map(x=>parseInt(x,16)),b=Net.subnet6($('eui-prefix').value);if(b.p!==64)throw Error('Use a /64 network for this SLAAC example.');m[0]^=2;const bytes=[...m.slice(0,3),255,254,...m.slice(3)],iid=BigInt('0x'+bytes.map(x=>x.toString(16).padStart(2,'0')).join(''));$('output').innerHTML=stats([['Interface ID',bytes.map(x=>x.toString(16).padStart(2,'0')).join(':'),'full'],['SLAAC address',Net.str6(b.start+iid),'full']]);});$('eui').click();}else if(i===3){$('v6-panel').innerHTML=card('IPv4 embedding',input('embed-ip','IPv4 address','192.0.2.10')+`<div class="actions">${btn('embed','Convert',true)}</div>`+out());action('embed',()=>{const n=Net.ip($('embed-ip').value),hex=Math.floor(n/65536).toString(16)+':'+(n%65536).toString(16);$('output').innerHTML=stats([['IPv4-mapped','::ffff:'+hex,'full'],['NAT64 well-known prefix','64:ff9b::'+hex,'full'],['6to4 prefix (legacy)','2002:'+hex+'::/48','full']])+hint('Mapped addresses represent IPv4 in an IPv6 API. NAT64 is a translation deployment. 6to4 is a legacy transition mechanism, not a recommended new deployment.');});$('embed').click();}else $('v6-panel').innerHTML=card('IPv6 reference',table(['Prefix','Use'],[['::/128','Unspecified'],['::1/128','Loopback'],['2000::/3','Current global-unicast allocation space'],['2001:db8::/32','Documentation'],['fc00::/7','Unique local'],['fe80::/10','Link-local'],['ff00::/8','Multicast'],['ff02::1','All nodes on link'],['ff02::2','All routers on link'],['ff02::5','OSPF routers']]));$('v6-tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('active',Number(b.dataset.v6)===i));};$('v6-tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>safe(()=>page(Number(b.dataset.v6))));page(0);}
function passwordLab(){$('surface').innerHTML=card('Password options',`<div class="fields">${select('pass-style','Style',['Random characters','Passphrase'])}${input('pass-len','Length / word count',20,'number','min="4" max="128"')}</div><div class="fields">${['Uppercase','Lowercase','Numbers','Symbols'].map((x,i)=>`<label><input type="checkbox" id="set-${i}" checked> ${x}</label>`).join('')}</div><div class="actions">${btn('generate','Generate locally',true)}${btn('pass-copy','Copy password')}</div>${out()}`+hint('Passwords stay in this browser. Generation uses rejection sampling with crypto.getRandomValues, without a remote service.'));let password='';const sets=['ABCDEFGHIJKLMNOPQRSTUVWXYZ','abcdefghijklmnopqrstuvwxyz','0123456789','!@#$%^&*()-_=+[]{}:,.?'];const words='acorn anchor apple atlas autumn beacon birch bloom breeze brook canyon cedar cloud cobalt coral cosmos crane crystal dawn delta dune eagle ember fern field flame forest frost galaxy garden harbor hazel horizon island ivory jade juniper kiwi lake lantern lemon lunar maple meadow mint mist mountain nectar ocean olive orbit otter pebble pine planet plum quartz raven reed ridge river robin rocket saffron sage sail silver slate snow solar sparrow spring stone storm summit sunset teal timber trail tulip valley violet willow winter wren zephyr'.split(' ');action('generate',()=>{const len=Number($('pass-len').value);if(!Number.isInteger(len)||len<4||len>128)throw Error('Length must be an integer between 4 and 128.');let bits;if($('pass-style').value==='Passphrase'){if(len>12)throw Error('Choose 4–12 words for a passphrase.');password=Array.from({length:len},()=>words[Net.randomInt(words.length)]).join('-');bits=len*Math.log2(words.length);}else{const active=sets.filter((x,i)=>$('set-'+i).checked);if(!active.length)throw Error('Select at least one character set.');const pool=active.join('');do{password=Array.from({length:len},()=>pool[Net.randomInt(pool.length)]).join('');}while(active.some(s=>![...password function unitsLab(){$('surface').innerHTML=card('Network quantity converter',`<div class="fields">${select('unit-mode','Converter',['Data size','Bandwidth','Transfer time','Bandwidth-delay product','TCP MSS','Number base','QoS serialization','Goodput','Timers','Packet rate'])}</div><div id="unit-fields"></div>${btn('convert','Calculate',true)}${out()}`);const specs={ 'Data size':[['u-a','Bytes',1048576],['u-b','Binary exponent (KiB=10, MiB=20)',20]],Bandwidth:[['u-a','Megabits per second',1000]],'Transfer time':[['u-a','File size (MB, decimal)',1000],['u-b','Link rate (Mbps)',100]],'Bandwidth-delay product':[['u-a','Link rate (Mbps)',100],['u-b','Round-trip time (ms)',50]],'TCP MSS':[['u-a','MTU (bytes)',1500],['u-b','IP + TCP header bytes',40]],'Number base':[['u-a','Decimal integer',192]],'QoS serialization':[['u-a','Packet size (bytes)',1500],['u-b','Link rate (Mbps)',10]],Goodput:[['u-a','Link rate (Mbps)',100],['u-b','Payload bytes',1460],['u-c','Total on-wire bytes',1538]],Timers:[['u-a','Milliseconds',500]],'Packet rate':[['u-a','Link rate (Mbps)',1000],['u-b','On-wire packet bytes',1538]]};const fields=()=>{$('unit-fields').innerHTML=`<div class="fields">${specs[$('unit-mode').value].map(([id,label,value])=>input(id,label,value,'number','min="0" step="any"')).join('')}</div>`;};action('convert',()=>{const m=$('unit-mode').value,a=Number($('u-a').value),b=$('u-b')?Number($('u-b').value):0,c=$('u-c')?Number($('u-c').value):0;if(!Number.isFinite(a)||a<0||($('u-b')&&(!Number.isFinite(b)||b<0)))throw Error('Use nonnegative finite values.');let r;switch(m){case'Data size':if(!Number.isInteger(b)||b>60)throw Error('Use an exponent 0–60.');r=[['Binary units',(a/2**b).toLocaleString()],['Bits',(a*8).toLocaleString()]];break;case'Bandwidth':r=[['Bytes per second',(a*1e6/8).toLocaleString()],['Gbps',(a/1000).toLocaleString()]];break;case'Transfer time':if(b===0)throw Error('Link rate must be positive.');r=[['Ideal seconds',(a*8/b).toFixed(3)]];break;case'Bandwidth-dela function pingLab(){$('surface').innerHTML=card('Simulated ping',`<div class="fields">${input('ping-target','Target label','192.0.2.1')}${select('ping-profile','Profile',['LAN','Routed LAN','Regional WAN','LTE','Intercontinental','Satellite','Congested'])}${input('ping-count','Count',10,'number','min="1" max="100"')}</div><div class="actions">${btn('ping-run','Run simulation',true)}${btn('ping-stop','Stop')}</div>${out()}`+hint('This is an educational simulation. It sends no ICMP packets and does not measure your actual connection.'));let timer=null,lines=[],values=[],sent=0;const profiles={LAN:[1,.2,0],'Routed LAN':[4,1,0],'Regional WAN':[30,8,.01],LTE:[65,25,.03],Intercontinental:[180,25,.01],Satellite:[600,70,.02],Congested:[120,100,.2]};const render=()=>{const lost=sent-values.length,avg=values.reduce((a,b)=>a+b,0)/(values.length||1),jitter=values.length>1?values.slice(1).reduce((s,v,i)=>s+Math.abs(v-values[i]),0)/(values.length-1):0;$('output').innerHTML=`<pre>${esc(lines.join('\n'))}</pre>`+stats([['Sent / received',sent+' / '+values.length],['Packet loss',sent?(lost/sent*100).toFixed(1)+'%':'—'],['Average RTT',values.length?avg.toFixed(2)+' ms':'—'],['Jitter (mean successive RTT delta)',jitter.toFixed(2)+' ms']])+`<div style="display:flex;align-items:end;height:90px;gap:5px">${values.map(v=>`<div title="${v.toFixed(2)} ms" style="flex:1;background:var(--blue);height:${Math.max(2,v/(Math.max(...values)||1)*100)}%"></div>`).join('')}</div>`;};action('ping-run',()=>{const count=Number($('ping-count').value);if(!Number.isInteger(count)||count<1||count>100)throw Error('Count must be 1–100.');clearInterval(timer);lines=[];values=[];sent=0;const [mean,spread,loss]=profiles[$('ping-profile').value],target=$('ping-target').value;timer=setInterval(()=>{sent++;if(Net.randomInt(10000)<loss*10000)lines.push(`seq=${sent} Request timed out`);else{const v=Math.max(.1,mean+(Net.randomInt(20001)/10000-1)*spread);values.push(v);lines.push(`Reply from ${target}: seq=${sent} time= </script><script>function protocolFields(id,mode,index){if(index<0)return '';let rows=[];if(id==='arp')rows=[['EtherType','0x0806'],['Hardware / protocol','Ethernet / IPv4'],['Operation',index<2?'1 — request':'2 — reply'],['Sender IP','192.168.10.10'],['Target IP','192.168.10.20'],['Destination MAC',index<2?'ff:ff:ff:ff:ff:ff':'02:00:00:00:00:10']];else if(id==='icmp')rows=[['IP protocol','1'],['Type',mode==='PMTUD'?'3 (unreachable)':mode==='Traceroute'?'11 at an intermediate hop / destination response at final hop':index===0?'8 (echo request)':'0 (echo reply)'],['Code',mode==='PMTUD'?'4 (fragmentation needed)':'0 in the echo / time exceeded examples'],['Echo identifier','0x1234'],['Sequence',index+1]];else if(id==='dhcp'||id==='relay'){const stages=id==='relay'?['DISCOVER','DISCOVER relay','OFFER','OFFER relay','REQUEST / ACK']:['DISCOVER','OFFER','REQUEST','ACK'];rows=[['Transport','UDP'],['Client port','68'],['Server port','67'],['Message',stages[Math.min(index,stages.length-1)]],['Offered address','192.168.10.100'],['Lease example','3600 seconds'],['giaddr',id==='relay'?'192.168.10.1':'0.0.0.0'],['Option 82',mode==='Option 82'?'Circuit ID: VLAN10 / port1':'Not inserted in this scenario']];}else if(id==='nat')rows=[['Inside local','10.0.0.10'+(mode==='PAT overload'?':49152':'')],['Inside global',mode==='PAT overload'?'198.51.100.1:30001':'198.51.100.10'],['Outside global','203.0.113.80:443'],['Outside local','203.0.113.80:443'],['Mapping',mode]];else if(id==='tcp'||id==='tcp-state')rows=[['Source / destination','Example client ephemeral port / server 443'],['SYN initial sequences','Client 1000 / server 7000'],['Flags',mode==='Three-way handshake'?['SYN','SYN,ACK','ACK'][Math.min(index,2)]:mode==='Teardown'?['FIN,ACK','ACK','FIN,ACK','ACK'][Math.min(index,3)]:mode==='RST'?'RST':mode==='Data transfer'?'PSH,ACK / ACK':'See event'],['Window example','64240 bytes'],['Header without options','20 bytes']];else if(id==='dns')rows=[['Query name','lab.example'],['Record ty function tcpStateLab(){let state='CLOSED',server='LISTEN',seq=1000,ack=7000,rows=[],pending=false;$('surface').innerHTML=card('Connection parameters',`<div class="fields">${input('tcp-isn','Client initial sequence',1000,'number','min="0" max="4294967295"')}${input('tcp-sisn','Server initial sequence',7000,'number','min="0" max="4294967295"')}${input('tcp-bytes','Payload bytes',500,'number','min="1" max="65535"')}</div><div class="actions">${btn('tcp-start','Start handshake',true)}${btn('tcp-data','Send data')}${btn('tcp-loss','Lose next segment')}${btn('tcp-fin','Graceful close')}${btn('tcp-rst','Send RST')}${btn('tcp-reset','Reset')}</div>${out()}`);const wrap=n=>n%2**32;const draw=()=>{$('output').innerHTML=`<div class="topology"><div class="node ${state==='ESTABLISHED'?'selected':''}">Client<small>${state}</small></div><span class="wire"></span><div class="node ${server==='ESTABLISHED'?'selected':''}">Server<small>${server}</small></div></div>`+stats([['Client next sequence',seq],['Server next sequence',ack]])+table(['From','To','Flags','Sequence','Acknowledgment','Payload'],rows)+hint('This model uses a simple single-direction data stream with immediate ACKs. Sequence arithmetic wraps at 2^32; it does not model congestion windows or real timers.');$('tcp-start').disabled=state!=='CLOSED';['tcp-data','tcp-loss','tcp-fin'].forEach(id=>$(id).disabled=state!=='ESTABLISHED');$('tcp-rst').disabled=state==='CLOSED';};action('tcp-start',()=>{seq=Number($('tcp-isn').value);ack=Number($('tcp-sisn').value);if(![seq,ack].every(x=>Number.isInteger(x)&&x>=0&&x<2**32))throw Error('Initial sequences must be 0–4294967295.');rows.push(['Client','Server','SYN',seq,0,0]);seq=wrap(seq+1);rows.push(['Server','Client','SYN,ACK',ack,seq,0]);ack=wrap(ack+1);rows.push(['Client','Server','ACK',seq,ack,0]);state=server='ESTABLISHED';draw();});action('tcp-data',()=>{const bytes=Number($('tcp-bytes').value);if(!Number.isInteger(bytes)||bytes<1||bytes>65535)throw Error('Payload must be 1–65535 bytes.');rows.push(['Client','Server',pending?'PSH,ACK (lost)':'PSH,ACK',seq,ack,bytes]);if(pending){rows.push(['Client','Server','PSH,ACK (retransmitted)',seq,ack,bytes]);pending=false;}seq=wrap(seq+bytes);rows.push(['Server','Client','ACK',ack,seq,0]);draw();});action('tcp-loss',()=>{pending=true;toast('The next data segment will be lost, then retransmitted.');});action('tcp-fin',()=>{rows.push(['Client','Server','FIN,ACK',seq,ack,0]);seq=wrap(seq+1);rows.push(['Server','Client','ACK',ack,seq,0]);rows.push(['Server','Client','FIN,ACK',ack,seq,0]);ack=wrap(ack+1);rows.push(['Client','Server','ACK',seq,ack,0]);state='TIME-WAIT';server='CLOSED';draw();});action('tcp-rst',()=>{rows.push(['Client','Server','RST',seq,ack,0]);state=server='CLOSED';draw();});action('tcp-reset',()=>{rows=[];state='CLOSED';server='LISTEN';pending=false;draw();});draw();}
function packetTraceLab(){$('surface').innerHTML=card('Packet and routes',`<div class="fields">${input('trace-src','Source IP','192.168.10.33')}${input('trace-dst','Destination IP','203.0.113.10')}${input('trace-source-net','Source subnet','192.168.10.0/24')}${input('trace-gateway','Gateway','192.168.10.1')}</div>`+area('trace-routes','Gateway route table (CIDR via next-hop)','203.0.113.0/24 via 192.0.2.2\n0.0.0.0/0 via 192.0.2.254')+`<div class="fields">${input('trace-ttl','Initial TTL',64,'number','min="1" max="255"')}<label><input id="trace-return" type="checkbox" checked> Return route exists at destination</label></div>${btn('trace-run','Trace forwarding',true)}${out()}`);action('trace-run',()=>{const src=Net.ip($('trace-src').value),dst=Net.ip($('trace-dst').value),base=Net.subnet($('trace-source-net').value),gw=Net.ip($('trace-gateway').value),ttl=Number($('trace-ttl').value);if(src<base.start||src>base.end||gw<base.start||gw>base.end)throw Error('Source and gateway must be inside the source subnet.');if(base.p<31&&(src===base.start||src===base.end||gw===base.start||gw===base.end))throw Error('Source and gateway must be usable host addresses.');if(!Number.isInteger(ttl)||ttl<1||ttl>255)throw Error('TTL must be 1–255.');const local=dst>=base.start&&dst<=base.end;let rows=[['Host route decision',local?'Local subnet':'Use gateway '+Net.str(gw)],['ARP resolution',local?'Resolve destination MAC':'Resolve gateway MAC']];let result;if(local){rows.push(['Layer 2 delivery','Switch forwards inside the VLAN']);result='Direct local-link delivery';}else if(ttl<=1){rows.push(['Gateway TTL','TTL expires; ICMP Time Exceeded may be returned']);result='TTL expired';}else{const routes=$('trace-routes').value.split('\n').filter(x=>x.trim()).map(line=>{const [cidr,next]=line.split(/\s+via\s+/);const b=Net.subnet(cidr.trim());if(!next)throw Error('Each route needs CIDR via next-hop.');Net.ip(next.trim());return{b,next:next.trim()};}).filter(r=>dst>=r.b.start&&dst<=r.b.end).sort((a,b)=>b.b.p-a.b.p);if(!routes.length){rows.push(['Gateway lookup','No matching route']);result='Unreachable';}else{rows.push(['Longest-prefix match',routes[0].b.cidr],['Next-hop forwarding',routes[0].next],['New TTL',ttl-1],['Remote path','Forwarding beyond this gateway depends on downstream route tables'],['Return path',$('trace-return').checked?'Assumed reachable':'Missing in this scenario']);result=$('trace-return').checked?'First-hop forwarding succeeds; return path assumed':'One-way path: return routing missing';}}$('output').innerHTML=stats([['Result',result,'full']])+table(['Step','Decision'],rows)+hint('This packet walk validates local delivery or one gateway lookup. It does not claim end-to-end reachability without modeling downstream routers.');});$('trace-run').click();}
</script><script>function routingModule(id){const f={acl:aclLab,standard:aclLab,extended:aclLab,'acl-sim':aclLab,prefix:prefixLab,policy:prefixLab,'ospf-filter':prefixLab,topology:topologyLab,stp:stpLab,election:electionLab,area:ospfAreaLab,stub:ospfAreaLab,'link-types':linkTypesLab,'ospf-path':ospfPathLab,'bgp-best':bgpBestLab,'bgp-select':bgpBestLab,'next-hop':nextHopLab,community:communityLab,regex:regexLab,'as-regex':regexLab,convergence:convergenceLab,lsa:lsaLab,routes:routesLab,show:showLab,decoder:decoderLab};if(!f[id])return false;f[id](id);return true;}
function aclLab(id){let rules=[],standard=id==='standard',config='';$('surface').innerHTML=`<div class="grid equal"><div>${card('Add a rule',`<div class="fields">${select('acl-type','Type',['Extended','Standard'])}${input('acl-name','ACL name','PARAM-LAB')}${select('acl-action','Action',['permit','deny'])}${select('acl-protocol','Protocol',['ip','tcp','udp','icmp'])}</div><div class="fields">${input('acl-src','Source (CIDR or any)','192.168.10.0/24')}${input('acl-dst','Destination (CIDR or any)','any')}${input('acl-port','Destination port (blank = any)','','number','min="1" max="65535"')}</div>${btn('acl-add','Add rule',true)}`)}${card('Test a packet',`<div class="fields">${input('test-src','Source IP','192.168.10.33')}${input('test-dst','Destination IP','203.0.113.10')}${select('test-proto','Protocol',['tcp','udp','icmp'])}${input('test-port','Destination port',443,'number')}</div>${btn('acl-test','Evaluate top down',true)}${out()}`)}</div><div>${card('Ordered rule list',out('acl-rules'))}${card('Generated IOS configuration',`<div class="actions">${btn('acl-copy','Copy config')}${btn('acl-save','Download config')}${btn('acl-clear','Clear rules')}</div>${out('acl-config')}`)}</div></div>`;$('acl-type').value=standard?'Standard':'Extended';const parse=s=>s.trim()==='any'?Net.subnet('0.0.0.0/0'):Net.subnet(s.trim());const match=(s,ip)=>{const n=parse(s),v=Net.ip(ip);return v>=n.start&&v<=n.end;};const cli=s=>{const n=parse(s);return n.p===0?'any':n.p===32?'host '+n.network:n.network+' '+n.wildcard;};const draw=()=>{config=`ip access-list ${standard?'standard':'extended'} ${$('acl-name').value}\n`+rules.map((r,i)=>` ${10*(i+1)} ${r.action} ${standard?'':r.proto+' '}${cli(r.src)}${standard?'':' '+cli(r.dst)+(r.port?' eq '+r.port:'')}`).join('\n');$('acl-rules').innerHTML=rules.length?table(['Seq','Action','Source','Destination','Protocol','Port',''],rules.map((r,i)=>[10*(i+1),r.action,esc(r.src),standard?'—':esc(r.dst),standard?'—':r.proto,r.port||'any',`<button data-remove="${i}">Remove</button>`])):hint('No entries. An empty applied ACL and a configured ACL with rules have different behavior on devices; add rules to test this model.');$('acl-config').innerHTML=`<pre>${esc(config)}</pre>`+hint('Evaluation stops at the first match. This teaching model applies an implicit deny to unmatched packets.');$('acl-rules').querySelectorAll('button').forEach(b=>b.onclick=()=>{rules.splice(Number(b.dataset.remove),1);draw();});};action('acl-add',()=>{if(!/^[A-Za-z][A-Za-z0-9_-]{0,40}$/.test($('acl-name').value))throw Error('Use a simple ACL name starting with a letter.');const src=$('acl-src').value,dst=$('acl-dst').value,p=$('acl-port').value,proto=$('acl-protocol').value;parse(src);parse(dst);if(p&&(!Number.isInteger(Number(p))||Number(p)<1||Number(p)>65535||!['tcp','udp'].includes(proto)))throw Error('A port requires TCP/UDP and a value 1–65535.');rules.push({src,dst,port:p?Number(p):null,proto,action:$('acl-action').value});draw();});action('acl-test',()=>{const src=$('test-src').value,dst=$('test-dst').value,p=Number($('test-port').value),proto=$('test-proto').value;Net.ip(src);Net.ip(dst);if(!Number.isInteger(p)||p<1||p>65535)throw Error('Use a destination port 1–65535.');const index=rules.findIndex(r=>match(r.src,src)&&(standard||(match(r.dst,dst)&&(r.proto==='ip'||r.proto===proto)&&(!r.port||r.port===p))));$('output').innerHTML=stats([['Decision',index<0?'DENY':rules[index].action.toUpperCase(),index>=0&&rules[index].action==='permit'?'highlight':''],['Matched rule',index<0?'Implicit deny':'Sequence '+10*(index+1)]])+hint(index<0?'No configured rule matches all required fields.':`Rule ${10*(index+1)} is the first match; later entries are not evaluated.`);});$('acl-type').onchange=()=>{standard=$('acl-type').value==='Standard';rules=[];draw();};action('acl-copy',()=>copy(config));action('acl-save',()=>download('param-acl.txt',config));action('acl-clear',()=>{rules=[];draw();});draw();}
function prefixLab(id){let entries=[],text='';$('surface').innerHTML=card('Prefix-list entry',`<div class="fields">${input('pl-seq','Sequence',10,'number')}${select('pl-action','Action',['permit','deny'])}${input('pl-network','Prefix','10.0.0.0/8')}${input('pl-ge','ge (optional)','','number')}${input('pl-le','le (optional)',24,'number')}</div>${btn('pl-add','Add entry',true)}${out('pl-list')}`)+card('Test prefix and route-map action',`<div class="fields">${input('pl-test','Test prefix','10.1.2.0/24')}${input('pl-lp','Set local preference',200,'number')}${input('pl-med','Set MED',0,'number')}</div><div class="actions">${btn('pl-evaluate','Evaluate policy',true)}${btn('pl-copy','Copy configuration')}</div>${out()}`);const draw=()=>{$('pl-list').innerHTML=table(['Seq','Action','Prefix','ge','le',''],entries.map((e,i)=>[e.seq,e.action,e.b.cidr,e.ge??'—',e.le??'—',`<button data-del="${i}">Remove</button>`]));$('pl-list').querySelectorAll('button').forEach(b=>b.onclick=()=>{entries.splice(Number(b.dataset.del),1);draw();});text=entries.map(e=>`ip prefix-list PARAM-PREFIXES seq ${e.seq} ${e.action} ${e.b.cidr}${e.ge!==null?' ge '+e.ge:''}${e.le!==null?' le '+e.le:''}`).join('\n');};action('pl-add',()=>{const b=Net.subnet($('pl-network').value),seq=Number($('pl-seq').value),ge=$('pl-ge').value===''?null:Number($('pl-ge').value),le=$('pl-le').value===''?null:Number($('pl-le').value);if(!Number.isInteger(seq)||seq<1||entries.some(e=>e.seq===seq))throw Error('Sequence must be a unique positive integer.');if((ge!==null&&(!Number.isInteger(ge)||ge<=b.p||ge>32))||(le!==null&&(!Number.isInteger(le)||le<b.p||le>32))||(ge!==null&&le!==null&&ge>le))throw Error('Length qualifiers must satisfy base ≤ le ≤ 32, base < ge ≤ 32 and ge ≤ le.');entries.push({b,seq,ge,le,action:$('pl-action').value});entries.sort((a,b)=>a.seq-b.seq);draw();$('pl-seq').value=seq+10;});action('pl-evaluate',()=>{const t=Net.subnet($('pl-test').value),lp=Number($('pl-lp').value),med=Number($('pl-med').value);if(![lp,med].every(x=>Number.isInteger(x)&&x>=0&&x<=4294967295))throw Error('Attributes must be unsigned 32-bit integers.');const e=entries.find(e=>{const min=e.ge??e.b.p,max=e.le??(e.ge!==null?32:e.b.p);return t.start>=e.b.start&&t.end<=e.b.end&&t.p>=min&&t.p<=max;});const allowed=e?.action==='permit';$('output').innerHTML=stats([['Decision',allowed?'PERMIT':'DENY'],['Matched sequence',e?.seq||'Implicit deny']])+`<pre>${esc(text)}\n\nroute-map PARAM-POLICY permit 10\n match ip address prefix-list PARAM-PREFIXES\n set local-preference ${lp}\n set metric ${med}</pre>`+hint(id==='ospf-filter'?'OSPF distribute-list filtering affects local RIB installation; it does not generally stop intra-area LSA flooding. Area filter-list controls Type 3 summaries at ABRs.':'A prefix-list is a match condition. A route-map must be applied in the appropriate direction to a neighbor to affect policy.');});action('pl-copy',()=>copy(text+`\nroute-map PARAM-POLICY permit 10\n match ip address prefix-list PARAM-PREFIXES\n set local-preference ${$('pl-lp').value}\n set metric ${$('pl-med').value}`));$('pl-add').click();$('pl-evaluate').click();}
function topologyLab() {let count=4,links=[{a:0,b:1,cost:10},{a:1,b:2,cost:10},{a:0,b:2,cost:30},{a:2,b:3,cost:5},{a:1,b:3,cost:40}],config='';$('surface').innerHTML=card('Topology editor',`<div class="fields">${select('topo-preset','Preset',['Diamond','Triangle','Ring','Hub and spoke'])}${select('spf-source','Calculate from',['R1','R2','R3','R4'])}</div><div class="actions">${btn('topo-add','Add router')}${btn('spf','Run SPF',true)}${btn('topo-export','Export interface plan')}</div>${out('topo-view')}<div id="links"></div><div class="fields">${input('link-a','Router A number',1,'number')}${input('link-b','Router B number',4,'number')}${input('link-cost','OSPF cost',10,'number')}</div>${btn('link-add','Add link')}`)+card('Shortest path result',out());const draw=()=>{$('topo-view').innerHTML=`<div class="topology">${Array.from({length:count},(_,i)=>`<button class="node" data-router="${i}">R${i+1}<small>AREA 0</small></button>`).join('')}</div>`;$('links').innerHTML=table(['Link','Cost','Failed',''],links.map((l,i)=>[`R${l.a+1} ↔ R${l.b+1}`,`<input type="number" min="1" max="65535" value="${l.cost}" data-cost="${i}" aria-label="Cost of link ${i+1}">`,`<input type="checkbox" data-down="${i}" ${l.down?'checked':''} aria-label="Fail link ${i+1}">`,`<button data-delete="${i}">Remove</button>`]));$('links').querySelectorAll('[data-cost]').forEach(b=>b.onchange=()=>safe(()=>{const c=Number(b.value);if(!Number.isInteger(c)||c<1||c>65535)throw Error('OSPF cost must be 1–65535.');links[Number(b.dataset.cost)].cost=c;calculate();}));$('links').querySelectorAll('[data-down]').forEach(b=>b.onchange=()=>{links[Number(b.dataset.down)].down=b.checked;calculate();});$('links').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{links.splice(Number(b.dataset.delete),1);draw();calculate();});$('topo-view').querySelectorAll('[data-router]').forEach(b=>b.onclick=()=>{$('spf-source').value='R'+(Number(b.dataset.router)+1);calculate();});};const calculate=()=>{const s=Number($('spf-source').value.slice(1))-1,r=Net.spf(count,links,s);$('output').innerHTML=table(['Destination','Cost','Path'],r.dist.map((d,i)=>{let p=[i],n=i;while(r.prev[n]!==null){n=r.prev[n];p.unshift(n);}return['R'+(i+1),d===Infinity?'Unreachable':d,d===Infinity?'—':p.map(x=>'R'+(x+1)).join(' → ')];}));config=links.map((l,i)=>`! R${l.a+1} ↔ R${l.b+1}, link ${i+1}\n! Apply to the appropriate interface on each endpoint:\nip ospf 1 area 0\nip ospf cost ${l.cost}${l.down?'\n! link currently failed in simulation':''}`).join('\n\n');};action('spf',calculate);$('spf-source').onchange=calculate;action('topo-add',()=>{if(count>=12)throw Error('This workspace supports up to 12 routers.');count++;$('spf-source').insertAdjacentHTML('beforeend',`<option>R${count}</option>`);draw();calculate();});action('link-add',()=>{const a=Number($('link-a').value)-1,b=Number($('link-b').value)-1,cost=Number($('link-cost').value);if(![a,b,cost].every(Number.isInteger)||a<0||a>=count||b<0||b>=count||a===b||cost<1||cost>65535)throw Error('Use two different existing router numbers and a cost 1–65535.');if(links.some(l=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a)))throw Error('That link already exists.');links.push({a,b,cost});draw();calculate();});$('topo-preset').onchange=()=>{const p=$('topo-preset').value;if(p==='Triangle'){count=3;links=[{a:0,b:1,cost:10},{a:1,b:2,cost:10},{a:0,b:2,cost:30}];}else{count=4;links=p==='Ring'?[{a:0,b:1,cost:10},{a:1,b:2,cost:10},{a:2,b:3,cost:10},{a:3,b:0,cost:10}]:p==='Hub and spoke'?[{a:0,b:1,cost:10},{a:0,b:2,cost:10},{a:0,b:3,cost:10}]:[{a:0,b:1,cost:10},{a:1,b:2,cost:10},{a:0,b:2,cost:30},{a:2,b:3,cost:5},{a:1,b:3,cost:40}];}$('spf-source').innerHTML=Array.from({length:count},(_,i)=>`<option>R${i+1}</option>`).join('');draw();calculate();};action('topo-export',()=>download('param-ospf-interface-plan.txt',config));draw();calculate();}
function stpLab(){$('surface').innerHTML=card('Three-switch triangle',`<div class="fields">${input('stp-p1','SW1 priority',32768,'number','step="4096"')}${input('stp-p2','SW2 priority',24576,'number','step="4096"')}${input('stp-p3','SW3 priority',32768,'number','step="4096"')}${select('stp-mode','Protocol',['STP','RSTP'])}</div><div class="fields">${input('stp-c12','SW1–SW2 cost',4,'number')}${input('stp-c23','SW2–SW3 cost',4,'number')}${input('stp-c13','SW1–SW3 cost',19,'number')}</div>${btn('stp-run','Elect and calculate',true)}${out()}`);action('stp-run',()=>{const priorities=[1,2,3].map(i=>Number($('stp-p'+i).value));if(priorities.some(p=>!Number.isInteger(p)||p<0||p>61440||p%4096))throw Error('Bridge priorities must be multiples of 4096 from 0 to 61440.');const costs=['12','23','13'].map(x=>Number($('stp-c'+x).value));if(costs.some(c=>!Number.isInteger(c)||c<1))throw Error('Path costs must be positive integers.');let root=priorities.indexOf(Math.min(...priorities)),links=[{a:0,b:1,cost:costs[0]},{a:1,b:2,cost:costs[1]},{a:0,b:2,cost:costs[2]}],r=Net.spf(3,links,root);$('output').innerHTML=stats([['Root bridge','SW'+(root+1)],['Protocol',$('stp-mode').value]])+table(['Switch','Root path cost','Root port toward'],r.dist.map((c,i)=>['SW'+(i+1),c,i===root?'Root bridge':'SW'+(r.prev[i]+1)]))+table(['Segment','Endpoint role A','Endpoint role B'],links.map(l=>{const dp=r.dist[l.a]<r.dist[l.b]?l.a:r.dist[l.b]<r.dist[l.a]?l.b:priorities[l.a]<=priorities[l.b]?l.a:l.b;return[`SW${l.a+1} ↔ SW${l.b+1}`,r.prev[l.a]===l.b?'Root':dp===l.a?'Designated':$('stp-mode').value==='RSTP'?'Alternate / discarding':'Blocking',r.prev[l.b]===l.a?'Root':dp===l.b?'Designated':$('stp-mode').value==='RSTP'?'Alternate / discarding':'Blocking'];}))+hint('This triangle uses unique fixed MACs ordered SW1 < SW2 < SW3 for bridge-ID ties. Production tie-breaking also considers sender bridge and port identifiers. RSTP uses discarding, learning and forwarding states.');});$('stp-run').click();}
function electionLab(){let incumbent=null;$('surface').innerHTML=card('Broadcast-network election',`<div class="fields">${[1,2,3,4].map(i=>input('dr-'+i,'R'+i+' priority',i===2?100:i===3?50:1,'number','min="0" max="255"')).join('')}</div><div class="actions">${btn('elect','Run new election',true)}${btn('dr-arrival','Evaluate newcomer')}${btn('dr-fail','Fail current DR')}</div>${out()}`);const eligible=()=>[1,2,3,4].map(i=>({i,p:Number($('dr-'+i).value)})).filter(x=>x.p>0).sort((a,b)=>b.p-a.p||b.i-a.i);const validate=()=>{for(let i=1;i<=4;i++){const p=Number($('dr-'+i).value);if(!Number.isInteger(p)||p<0||p>255)throw Error('Priority must be 0–255.');}};let dr=null,bdr=null;const draw=message=>{$('output').innerHTML=stats([['DR',dr?'R'+dr:'None'],['BDR',bdr?'R'+bdr:'None']])+table(['Router','RID','Priority','Role'],[1,2,3,4].map(i=>['R'+i,`${i}.${i}.${i}.${i}`,$('dr-'+i).value,i===dr?'DR':i===bdr?'BDR':Number($('dr-'+i).value)===0?'Ineligible':'DROther']))+hint(message);};action('elect',()=>{validate();const a=eligible();dr=a[0]?.i;bdr=a[1]?.i;incumbent=dr;draw('Fresh election: highest priority wins; highest router ID breaks a tie. Priority 0 is ineligible.');});action('dr-arrival',()=>{validate();const a=eligible();if(!dr){dr=a[0]?.i;bdr=a[1]?.i;}draw('A healthy DR is not preempted by a higher-priority newcomer. Clear/restart adjacency only when operationally justified.');});action('dr-fail',()=>{const old=dr;dr=bdr;bdr=eligible().filter(x=>x.i!==old&&x.i!==dr)[0]?.i;draw('The BDR is promoted when the DR fails. Another eligible router becomes BDR.');});$('elect').click();}

function ospfPathLab(){$('surface').innerHTML=card('Two candidate OSPF routes',`<div class="fields">${select('op-a','Route A type',['O','O IA','E1','N1','E2','N2'])}${input('op-ac','A external / route metric',20,'number')}${input('op-ai','A internal cost to exit',100,'number')}</div><div class="fields">${select('op-b','Route B type',['O','O IA','E1','N1','E2','N2'])}${input('op-bc','B external / route metric',10,'number')}${input('op-bi','B internal cost to exit',5,'number')}</div>${btn('ospf-choose','Select path',true)}${out()}`);$('op-b').value='E2';action('ospf-choose',()=>{const a=$('op-a').value,b=$('op-b').value,ca=Number($('op-ac').value),cb=Number($('op-bc').value),ia=Number($('op-ai').value),ib=Number($('op-bi').value);if([ca,cb,ia,ib].some(x=>!Number.isInteger(x)||x<0))throw Error('Costs must be nonnegative integers.');const rank={O:0,'O IA':1,E1:2,N1:2,E2:3,N2:3},score=(t,c,i)=>['E1','N1'].includes(t)?c+i:c;let winner,reason;if(rank[a]!==rank[b]){winner=rank[a]<rank[b]?'A':'B';reason='Route type preference';}else{const va=score(a,ca,ia),vb=score(b,cb,ib);if(va!==vb){winner=va<vb?'A':'B';reason='Metric comparison';}else if(['E2','N2'].includes(a)&&['E2','N2'].includes(b)&&ia!==ib){winner=ia<ib?'A':'B';reason='Equal type-2 metric; compare internal cost';}else{winner='Equal in this model';reason='Additional platform rules or ECMP apply';}}$('output').innerHTML=stats([['Preferred candidate',winner,'highlight'],['Reason',reason],['A comparison metric',score(a,ca,ia)],['B comparison metric',score(b,cb,ib)]])+hint('The model assumes valid routes to the same prefix. Intra-area wins over inter-area, then type-1 external over type-2. NSSA translation, RFC 1583 compatibility and vendor tie-breaks can add rules.');});$('ospf-choose').click();}
function bgpBestLab(){$('surface').innerHTML=card('Candidate attributes',table(['Attribute','Path A','Path B'],[['Weight','weight',0,0],['Local preference','localPref',100,100],['Locally originated (1=yes)','local',0,0],['AS-path length','pathLength',2,3],['Origin (0=IGP, 1=EGP, 2=incomplete)','origin',0,0],['MED (same neighboring AS)','med',50,100],['iBGP (1=yes; eBGP=0)','ibgp',0,0],['IGP cost to next hop','igp',10,20],['Router ID final tie-break (numeric)','routerId',1,2]].map(([label,key,a,b])=>[label,`<input id="bgp-a-${key}" aria-label="Path A ${label}" type="number" min="0" value="${a}">`,`<input id="bgp-b-${key}" aria-label="Path B ${label}" type="number" min="0" value="${b}">`]))+`<div class="fields"><label><input id="bgp-a-reach" type="checkbox" checked> Path A next hop reachable</label><label><input id="bgp-b-reach" type="checkbox" checked> Path B next hop reachable</label></div>${btn('best','Choose best path',true)}${out()}`+hint('This Cisco-style model compares valid paths for one prefix and assumes MED is comparable from the same neighboring AS. Weight is local to a router. Some production tie-breaks and multipath rules are outside this model.'));action('best',()=>{const routes=['a','b'].map(k=>{const r={name:k.toUpperCase(),reachable:$('bgp-'+k+'-reach').checked};for(const key of ['weight','localPref','local','pathLength','origin','med','ibgp','igp','routerId']){r[key]=Number($('bgp-'+k+'-'+key).value);if(!Number.isInteger(r[key])||r[key]<0||r[key]>4294967295)throw Error('Use nonnegative 32-bit integer attributes.');}if(r.origin>2||r.ibgp>1||r.local>1)throw Error('Origin must be 0–2; boolean attributes 0 or 1.');return r;});const b=Net.bestBGP(routes);$('output').innerHTML=stats([['Selected path',b.winner.name,'highlight'],['Decisive attribute',routes.filter(r=>r.reachable).length===1?'Next-hop reachability':b.decisive]]);});$('best').click();}
function nextHopLab(){$('surface').innerHTML=card('Advertisement controls',`<div class="fields">${select('nh-source','Advertisement',['eBGP → iBGP','Route reflector → client','Direct eBGP'])}${select('nh-reach','Reachability',['No route to original next hop','IGP route present','Static route present'])}</div><label><input id="nh-self" type="checkbox"> Apply next-hop-self (advertising router loopback is reachable)</label><div class="actions">${btn('nh-evaluate','Evaluate route',true)}</div>${out()}`);action('nh-evaluate',()=>{const direct=$('nh-source').value==='Direct eBGP',self=$('nh-self').checked,reachable=direct||self||$('nh-reach').value!=='No route to original next hop';$('output').innerHTML=stats([['Next hop',self?'10.0.0.1 (advertiser)':'192.0.2.1 (original)'],['Usable path?',reachable?'Yes':'No']])+hint(reachable?'The receiver can recursively resolve the next hop. Other policy and route validity checks still apply.':'The path cannot become a usable forwarding route until the advertised next hop is reachable.')+`<pre>router bgp 65000\n neighbor 10.0.0.2 remote-as 65000${self?'\n neighbor 10.0.0.2 next-hop-self':''}</pre>`;});$('nh-evaluate').click();}
function communityLab(){$('surface').innerHTML=card('Community policy',`<div class="fields">${select('comm','Tag',['no-export','no-advertise','65000:120','65535:666','65000:100:10'])}${select('comm-peer','Recipient',['External peer','Internal peer'])}${select('comm-policy','Recipient policy',['Honor configured tag policy','Ignore policy tag','Strip tag'])}</div>${btn('comm-run','Apply policy',true)}${out()}`);action('comm-run',()=>{const tag=$('comm').value,peer=$('comm-peer').value,policy=$('comm-policy').value;let result='Tag is metadata; no forwarding change by itself.';if(policy==='Strip tag')result='Tag removed before subsequent export.';else if(policy==='Ignore policy tag')result='No configured action for this teaching scenario. Well-known communities should be honored by compliant implementations.';else result=tag==='no-export'?peer==='External peer'?'Do not export outside this AS/confederation.':'May advertise internally.':tag==='no-advertise'?'Do not advertise to any BGP peer.':tag==='65000:120'?'Example route-map sets local preference to 200.':tag==='65535:666'?'Blackhole signaling requires explicit receiver policy and authorization.':'Large community identifies AS / function / parameter; action is policy-defined.';$('output').innerHTML=stats([['Tag',policy==='Strip tag'?'None':tag],['Outcome',result,'full']])+`<pre>route-map PARAM-TAG permit 10\n set ${tag.split(':').length===3?'large-community':'community'} ${esc(tag)} additive</pre>`+hint('Ordinary and large communities carry intent. A matching routing policy determines the action.');});$('comm-run').click();}
function regexLab(){$('surface').innerHTML=card('Cisco AS-path expression',input('regex','Expression','_65001_')+area('paths','AS paths, one per line','65001\n64500 65001\n65010 65011\n64500 65001 65002\n{65001 65002}')+`<div class="chips">${['^$','^65001_','_65001$','_65001_','.*'].map(x=>`<button data-regex="${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="actions">${btn('regex-run','Test expression',true)}</div>${out()}`+hint('Cisco _ matches an AS boundary (space, comma, braces, parentheses, beginning or end). This tool converts that boundary to a browser regular expression.'));action('regex-run',()=>{const raw=$('regex').value;if(raw.length>120||/\([^)]*[+*][^)]*\)[+*{]|\([^)]*\|[^)]*\)[+*{]/.test(raw))throw Error('Use a short expression without nested or ambiguous repeated groups.');const regex=new RegExp(raw.replace(/_/g,'(?:^|$|[ ,{}()])'));const lines=$('paths').value.split('\n');if(lines.length>200||lines.some(x=>x.length>250))throw Error('Use at most 200 paths of 250 characters.');$('output').innerHTML=table(['AS path','Match'],lines.map(s=>[esc(s)||'(empty)',regex.test(s)?'<span class="positive">Match</span>':'No match']))+`<pre>ip as-path access-list 10 permit ${esc(raw)}</pre>`;});$('surface').querySelectorAll('[data-regex]').forEach(b=>b.onclick=()=>{$('regex').value=b.dataset.regex;$('regex-run').click();});$('regex-run').click();}
function convergenceLab(){$('surface').innerHTML=card('Convergence phases',`<div class="fields">${select('conv-profile','Preset',['OSPF default','BFD tuned','BGP hold timer','Custom'])}</div><div class="fields">${input('detect','Failure detection (ms)',40000,'number')}${input('schedule','Scheduling (ms)',50,'number')}${input('compute','Computation (ms)',200,'number')}${input('rib','RIB update (ms)',50,'number')}${input('fib','FIB programming (ms)',10,'number')}</div>${btn('conv-run','Estimate convergence',true)}${out()}`);action('conv-run',()=>{const values=['detect','schedule','compute','rib','fib'].map(id=>Number($(id).value));if(values.some(x=>!Number.isFinite(x)||x<0))throw Error('Phase durations must be nonnegative.');const total=values.reduce((a,b)=>a+b,0);$('output').innerHTML=stats([['Estimated total',total.toLocaleString()+' ms','big highlight'],['Seconds',(total/1000).toFixed(3)]])+`<div style="display:flex;height:35px;margin:20px 0">${values.map((v,i)=>`<div title="${v} ms" style="width:${v/(total||1)*100}%;background:${['#74a9ff','#5be0c3','#f4aa76','#ae9fff','#ff938f'][i]}"></div>`).join('')}</div>`+table(['Phase','Duration'],['Failure detection','Scheduling','Computation','RIB install','FIB programming'].map((p,i)=>[p,values[i]+' ms']))+hint('An additive teaching estimate. Actual convergence includes propagation, pacing, CPU load and hardware behavior; some phases overlap.');});$('conv-profile').onchange=()=>{const vals=$('conv-profile').value==='BFD tuned'?[150,10,20,10,10]:$('conv-profile').value==='BGP hold timer'?[180000,0,50,50,10]:[40000,50,200,50,10];['detect','schedule','compute','rib','fib'].forEach((id,i)=>$(id).value=vals[i]);$('conv-run').click();};$('conv-run').click();}

function lsaLab(){$('surface').innerHTML=card('Link-state advertisement explorer',`<div class="fields">${select('lsa-type','LSA type',Object.entries(LSA_INFO).map(([k,v])=>[k,'Type '+k+' — '+v[0]]))}${input('lsa-rid','Advertising router','1.1.1.1')}${input('lsa-age','Age (seconds)',312,'number','min="0" max="3600"')}</div>${btn('lsa-inspect','Inspect LSA',true)}${out()}`)+card('Common header layout',table(['Bytes','Field'],[['2','LS age'],['1','Options'],['1','LS type'],['4','Link State ID'],['4','Advertising router'],['4','Sequence number'],['2','Checksum'],['2','Length']]));action('lsa-inspect',()=>{const t=$('lsa-type').value,v=LSA_INFO[t],age=Number($('lsa-age').value);Net.ip($('lsa-rid').value);if(!Number.isInteger(age)||age<0||age>3600)throw Error('LSA age must be 0–3600 seconds.');$('output').innerHTML=stats([['LSA',v[0]],['Originator',v[1]],['Flooding scope',v[2]],['Purpose',v[3]],['Advertising router',$('lsa-rid').value],['Age status',age===3600?'MaxAge: eligible for flush':age>=1800?'Past usual refresh interval':'Within refresh interval']])+`<pre>show ip ospf database${t==='1'?' router':t==='2'?' network':t==='5'?' external':''}</pre>`;});$('lsa-inspect').click();}
function routesLab(){$('surface').innerHTML=card('Routing table input',area('route-text','Paste CIDR lines or IOS-style routes','C 192.168.10.0/24 is directly connected, GigabitEthernet0/0\nO 10.0.0.0/8 [110/20] via 192.168.10.1\nS* 0.0.0.0/0 [1/0] via 192.168.10.254\nB 203.0.113.0/24 [20/0] via 192.168.10.2')+`<div class="fields">${input('route-ip','Destination lookup','203.0.113.33')}</div>${btn('route-parse','Parse and look up',true)}${out()}`);action('route-parse',()=>{const dest=Net.ip($('route-ip').value),rows=$('route-text').value.split('\n').map(line=>{const m=line.match(/\b(\d+\.\d+\.\d+\.\d+\/\d{1,2})\b/);if(!m)return null;const b=Net.subnet(m[1]);return{b,protocol:line.trim().match(/^[A-Za-z* ]+/)?.[0].trim()||'—',next:line.match(/via\s+([\d.]+)/)?.[1]||'Connected / unspecified',ad:line.match(/\[(\d+)\/(\d+)\]/)?.[1]||'—'};}).filter(Boolean);if(!rows.length)throw Error('No CIDR routes were found. This parser requires explicit prefix lengths.');const matches=rows.filter(r=>dest>=r.b.start&&dest<=r.b.end).sort((a,b)=>b.b.p-a.b.p||Number(a.ad)-Number(b.ad));$('output').innerHTML=stats([['Parsed routes',rows.length],['Longest prefix',matches[0]?.b.cidr||'No route']])+table(['Prefix','Protocol','AD','Next hop'],rows.map(r=>[r===matches[0]?`<strong class="positive">${r.b.cidr}</strong>`:r.b.cidr,esc(r.protocol),r.ad,esc(r.next)]))+hint('CIDR prefixes are recognized directly. IOS classful shorthand without a slash is not inferred. Equal-prefix routes require the full RIB selection rules.');});$('route-parse').click();}
function showLab(){$('surface').innerHTML=card('Interpret operational output',`<div class="chips">${['OSPF neighbor','BGP summary','EIGRP topology','IS-IS neighbor','MPLS LFIB'].map(x=>`<button data-show="${x}">${x}</button>`).join('')}</div>`+area('show-text','Command output','Neighbor ID     Pri   State       Dead Time   Address       Interface\n2.2.2.2         1     FULL/DR     00:00:35    10.0.0.2      Gi0/0')+`<div class="actions">${btn('show-analyze','Analyze output',true)}</div>${out()}`);const samples={'OSPF neighbor':'Neighbor ID Pri State Dead Time Address Interface\n2.2.2.2 1 EXSTART/DR 00:00:35 10.0.0.2 Gi0/0','BGP summary':'Neighbor V AS MsgRcvd MsgSent Up/Down State/PfxRcd\n192.0.2.1 4 65001 22 25 00:03:12 Active','EIGRP topology':'IP-EIGRP Topology Table for AS(100)\nP 10.1.0.0/24, 1 successors, FD is 3072\nvia 10.0.0.2 (3072/2816), Gi0/0','IS-IS neighbor':'System Id Type Interface State Holdtime\nR2 L2 Gi0/0 UP 22','MPLS LFIB':'Local Outgoing Prefix Bytes Outgoing Next Hop\n16 Pop Label 10.1.0.0/24 1024 Gi0/0 10.0.0.2'};action('show-analyze',()=>{const s=$('show-text').value;let type='Unknown',flags=[],next=[];if(/Neighbor ID|FULL\/|EXSTART|2WAY/i.test(s)){type='OSPF neighbor';next=['show ip ospf interface','show interfaces','show ip ospf database'];if(/EXSTART|EXCHANGE/i.test(s))flags.push('DBD synchronization incomplete: compare MTU, router IDs and packet exchange.');if(/INIT/i.test(s))flags.push('One-way Hello visibility: inspect ACL/multicast path and neighbor list.');if(/2WAY/i.test(s))flags.push('2-Way can be normal between broadcast DROther routers.');}else if(/State\/PfxRcd|MsgRcvd|BGP/i.test(s)){type='BGP summary';next=['show bgp neighbors','show ip route <peer>','show tcp brief'];if(/Active|Idle|Connect/i.test(s))flags.push('Session is not Established: inspect TCP/179 reachability, remote-AS, update-source and TTL.');}else if(/EIGRP|successors|FD is/i.test(s)){type='EIGRP topology';next=['show ip eigrp neighbors','show ip eigrp topology all-links'];flags.push('P means Passive (stable), not a disabled route. A means Active (diffusing computation).');}else if(/System Id|IS-IS/i.test(s)){type='IS-IS neighbor';next=['show isis neighbors detail','show clns interface'];}else if(/Pop Label|LFIB|Outgoing Prefix/i.test(s)){type='MPLS LFIB';next=['show mpls forwarding-table','show mpls ldp neighbor'];flags.push('Pop Label indicates penultimate-hop popping for the corresponding forwarding entry.');}else flags.push('Format not recognized. Use the samples or inspect the original command documentation.');$('output').innerHTML=stats([['Detected output',type]])+hint(flags.length?flags.map(esc).join('<br>'):'No known warning pattern was detected. This does not prove the device is healthy.')+`<pre>${esc(next.join('\n'))}</pre>`;});$('surface').querySelectorAll('[data-show]').forEach(b=>b.onclick=()=>{$('show-text').value=samples[b.dataset.show];$('show-analyze').click();});$('show-analyze').click();}
function decoderLab(){const sample='02 00 00 00 00 02 02 00 00 00 00 01 08 00 45 00 00 28 00 01 40 00 40 06 00 00 c0 00 02 01 c6 33 64 02 c0 00 01 bb 00 00 03 e8 00 00 00 00 50 02 fa f0 00 00 00 00';$('surface').innerHTML=card('Ethernet packet decoder',area('hex','Hex bytes (Ethernet frame)',sample)+`<div class="actions">${btn('decode','Decode fields',true)}${btn('decode-sample','Load TCP SYN sample')}</div>${out()}`);action('decode',()=>{const text=$('hex').value.trim();if(!/^(?:[0-9a-fA-F]{2}[\s:]*)+$/.test(text))throw Error('Use pairs of hexadecimal digits separated by spaces or colons.');const a=text.match(/[0-9a-fA-F]{2}/g).map(x=>parseInt(x,16));if(a.length<14)throw Error('An Ethernet header requires at least 14 bytes.');if(a.length>65535)throw Error('Use one frame, at most 65535 bytes.');const word=i=>a[i]*256+a[i+1],mac=i=>a.slice(i,i+6).map(x=>x.toString(16).padStart(2,'0')).join(':'),address=i=>a.slice(i,i+4).join('.');let rows=[['Ethernet destination',mac(0)],['Ethernet source',mac(6)],['EtherType','0x'+word(12).toString(16)]];let off=14,type=word(12);if(type===0x8100){if(a.length<18)throw Error('Truncated VLAN frame.');rows.push(['VLAN ID',word(14)&4095]);type=word(16);off=18;}if(type===0x0800){if(a.length<off+20)throw Error('Truncated IPv4 header.');const ihl=(a[off]&15)*4,total=word(off+2);if(a[off]>>4!==4||ihl<20||ihl>60||a.length<off+ihl||total<ihl||a.length<off+total)throw Error('Invalid or truncated IPv4 packet.');const proto=a[off+9],transport=off+ihl,frag=word(off+6)&8191;rows.push(['IPv4 source',address(off+12)],['IPv4 destination',address(off+16)],['IPv4 TTL',a[off+8]],['IPv4 header bytes',ihl],['IP total length',total],['IP protocol',proto],['Fragment offset (8-byte units)',frag]);if(!frag&&(proto===6||proto===17)){const need=proto===6?20:8;if(total<ihl+need)throw Error('Truncated transport header.');rows.push(['Source port',word(transport)],['Destination port',word(transport+2)]);if(proto===6){const seq=transport+4,ack=transport+8,number=i=>a.slice(i,i+4).reduce((n,b)=>n*256+b,0);rows.push(['Sequence',number(seq)],['Acknowledgment',number(ack)],['TCP flags','0x'+a[transport+13].toString(16)],['Window',word(transport+14)]);}}else if(proto===1&&!frag){if(total<ihl+4)throw Error('Truncated ICMP header.');rows.push(['ICMP type',a[transport]],['ICMP code',a[transport+1]]);}else if(proto===89&&!frag){if(total<ihl+24)throw Error('Truncated OSPF header.');rows.push(['OSPF version',a[transport]],['OSPF packet type',a[transport+1]],['Router ID',address(transport+4)],['Area ID',address(transport+8)]);}}else if(type===0x0806){if(a.length<off+28)throw Error('Truncated ARP frame.');rows.push(['ARP opcode',word(off+6)],['Sender MAC',mac(off+8)],['Sender IP',address(off+14)],['Target MAC',mac(off+18)],['Target IP',address(off+24)]);}else rows.push(['Payload','EtherType not decoded in this version']);$('output').innerHTML=table(['Field','Decoded value'],rows)+hint('Ethernet, 802.1Q, IPv4, TCP, UDP, ICMP, ARP and basic OSPF headers are decoded. Checksum validation and complete application payload decoding require a packet analyzer.');});action('decode-sample',()=>{$('hex').value=sample;$('decode').click();});$('decode').click();}
</script><script>function learningModule(id){const f={flash:flashLab,quiz:quizLab,interview:interviewLab,broken:brokenLab,design:designLab,cheat:cheatLab,more:moreLab,ccna:courseLab,ccnp:courseLab,ccie:courseLab,roadmap:roadmapLab,about:aboutLab};if(!f[id])return false;f[id](id);return true;}
function flashLab(){let deck=[...QA],i=0,correct=0,wrong=0,revealed=false;$('surface').innerHTML=card('Study deck',`<div class="fields">${select('flash-level','Level',['All','CCNA','CCNP','CCIE'])}</div><div class="actions">${btn('flash-shuffle','Shuffle')}${btn('flash-reset','Restart')}</div>${out('flash-score')}<button id="flash-card" class="flash" style="width:100%"></button><div class="actions">${btn('flash-reveal','Reveal answer',true)}${btn('flash-right','I knew it')}${btn('flash-wrong','Review again')}</div>${out()}`);const draw=()=>{$('flash-score').innerHTML=`<div class="score"><span>Correct: ${correct}</span><span>Review: ${wrong}</span><span>Remaining: ${Math.max(0,deck.length-i)}</span></div>`;const q=deck[i];$('flash-card').textContent=q?(revealed?q[3]:q[2]):'Deck complete — restart or choose another level.';$('flash-right').disabled=!q||!revealed;$('flash-wrong').disabled=!q||!revealed;$('output').innerHTML=q?hint(q[0]+' · '+q[1]+(revealed?' · Answer shown':' · Think through your answer before revealing it.')):'';};const reset=()=>{deck=QA.filter(q=>$('flash-level').value==='All'||q[0]===$('flash-level').value);i=correct=wrong=0;revealed=false;draw();};action('flash-reveal',()=>{revealed=true;draw();});$('flash-card').onclick=()=>{revealed=!revealed;draw();};action('flash-right',()=>{correct++;i++;revealed=false;draw();});action('flash-wrong',()=>{wrong++;i++;revealed=false;draw();});action('flash-reset',reset);action('flash-shuffle',()=>{for(let j=deck.length-1;j>0;j--){const k=Net.randomInt(j+1);[deck[j],deck[k]]=[deck[k],deck[j]];}i=correct=wrong=0;revealed=false;draw();});$('flash-level').onchange=reset;draw();}
function quizLab(){let deck=[...QA],i=0,score=0,answered=0,locked=false,options=[];$('surface').innerHTML=card('Knowledge check',`<div class="fields">${select('quiz-level','Difficulty',['All','CCNA','CCNP','CCIE'])}</div>${out('quiz-score')}${out('quiz-question')}${out('quiz-options')}${out()}<div class="actions">${btn('quiz-next','Next question',true)}${btn('quiz-reset','Reset quiz')}</div>`);const draw=()=>{locked=false;$('output').innerHTML='';$('quiz-next').disabled=true;$('quiz-score').innerHTML=`<div class="score"><span>Score: ${score} / ${answered}</span><span>Question ${i+1} / ${deck.length}</span></div>`;const q=deck[i];$('quiz-question').innerHTML=`<h3>${esc(q[2])}</h3><p>${q[0]} · ${q[1]}</p>`;options=[...q[4]].sort(()=>Math.random()-.5);$('quiz-options').innerHTML=options.map((o,k)=>`<button class="answer-option" data-option="${k}">${esc(o)}</button>`).join('');$('quiz-options').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(locked)return;locked=true;answered++;const yes=options[Number(b.dataset.option)]===q[4][0];if(yes)score++;b.classList.add(yes?'positive':'negative');$('output').innerHTML=hint(`${yes?'Correct.':'Review this one.'} ${esc(q[3])}`);$('quiz-next').disabled=false;$('quiz-score').innerHTML=`<div class="score"><span>Score: ${score} / ${answered}</span><span>Accuracy: ${Math.round(score/answered*100)}%</span></div>`;});};const reset=()=>{deck=QA.filter(q=>$('quiz-level').value==='All'||q[0]===$('quiz-level').value);i=score=answered=0;draw();};action('quiz-next',()=>{if(i+1===deck.length){$('quiz-question').innerHTML='<h3>Quiz complete</h3>';$('quiz-options').innerHTML='';$('quiz-next').disabled=true;$('output').innerHTML=hint(`You scored ${score} out of ${answered}. Restart to practice again.`);return;}i++;draw();});action('quiz-reset',reset);$('quiz-level').onchange=reset;draw();}
function interviewLab(){$('surface').innerHTML=card('Interview question bank',`<div class="fields">${select('interview-level','Level',['All','CCNA','CCNP','CCIE'])}${input('interview-search','Topic or keyword','')}</div>${out()}`);const draw=()=>{const level=$('interview-level').value,q=$('interview-search').value.toLowerCase(),a=QA.filter(x=>(level==='All'||x[0]===level)&&x.join(' ').toLowerCase().includes(q));$('output').innerHTML=hint(a.length+' questions. Explain the mechanism, then give a verification command or failure case.')+a.map(x=>`<details class="lesson"><summary><small class="positive">${x[0]} · ${x[1]}</small><br>${esc(x[2])}</summary><p>${esc(x[3])}</p><p>Follow-up: describe what evidence you would gather on a real device before changing its configuration.</p></details>`).join('');};$('interview-level').onchange=draw;$('interview-search').oninput=draw;draw();}
